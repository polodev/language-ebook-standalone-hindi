name: Deliver Easy Hindi Intermediate chapters 11-20

on:
  push:
    branches:
      - transport/02-easy-hindi-intermediate/ch011-ch020-20260912
    paths:
      - '.github/transfer-int-ch011-ch020/READY'

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/transfer-int-ch011-ch020/part-* | base64 -d > /tmp/int-ch011-ch020.tar.xz
          echo '6bee982595c7a98ef81b3b3ae9567cb55f699fddfad659a2cfeb5b66f0a66556  /tmp/int-ch011-ch020.tar.xz' | sha256sum -c -
          xz -dc /tmp/int-ch011-ch020.tar.xz > /tmp/int-ch011-ch020.tar
          echo '3fdacdcb5d4131bb683a48284eadec8b7f4d0bdef9ee6c69e1fd73aa99494f63  /tmp/int-ch011-ch020.tar' | sha256sum -c -
          tar -tf /tmp/int-ch011-ch020.tar

      - name: Trace extraction and validation
        shell: bash
        env:
          EXPECTED_MAIN: d79a0fb7cd84c4adfe9f4036038ac9404c05fcb6
        run: |
          set +e
          : > /tmp/debug.txt
          rm -f /tmp/delivery_failed
          echo 'checkpoint: begin' >> /tmp/debug.txt
          git status --short --branch >> /tmp/debug.txt 2>&1
          git checkout -B delivery "$EXPECTED_MAIN" >> /tmp/debug.txt 2>&1
          rc=$?
          echo "checkout_rc=$rc" >> /tmp/debug.txt
          if [ "$rc" -ne 0 ]; then touch /tmp/delivery_failed; exit 0; fi
          echo 'checkpoint: checkout_ok' >> /tmp/debug.txt
          tar -xf /tmp/int-ch011-ch020.tar >> /tmp/debug.txt 2>&1
          rc=$?
          echo "extract_rc=$rc" >> /tmp/debug.txt
          if [ "$rc" -ne 0 ]; then touch /tmp/delivery_failed; exit 0; fi
          echo 'checkpoint: extract_ok' >> /tmp/debug.txt
          missing=0
          for n in {11..20}; do
            f=$(printf '02-easy-hindi-intermediate/chapters/ch%03d.json' "$n")
            if [ -s "$f" ]; then echo "present: $f" >> /tmp/debug.txt; else echo "missing: $f" >> /tmp/debug.txt; missing=1; fi
          done
          if [ -s 02-easy-hindi-intermediate/authoring-progress.json ]; then echo 'present: authoring-progress.json' >> /tmp/debug.txt; else echo 'missing: authoring-progress.json' >> /tmp/debug.txt; missing=1; fi
          if [ "$missing" -ne 0 ]; then touch /tmp/delivery_failed; exit 0; fi
          echo 'checkpoint: files_ok' >> /tmp/debug.txt
          python3 scripts/manage.py validate --book 02-easy-hindi-intermediate >> /tmp/debug.txt 2>&1
          rc=$?
          echo "validator_rc=$rc" >> /tmp/debug.txt
          if [ "$rc" -ne 0 ]; then touch /tmp/delivery_failed; exit 0; fi
          echo 'checkpoint: validator_ok' >> /tmp/debug.txt
          exit 0

      - name: Upload diagnostic trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intermediate-ch011-ch020-debug
          path: /tmp/debug.txt
          if-no-files-found: error

      - name: Stop if trace found a failure
        shell: bash
        run: |
          test ! -f /tmp/delivery_failed

      - name: Commit actual source batch and push review branch
        shell: bash
        env:
          DELIVERY_BRANCH: content/02-easy-hindi-intermediate/ch011-ch020
          TRANSFER_BRANCH: transport/02-easy-hindi-intermediate/ch011-ch020-20260912
          EXPECTED_MAIN: d79a0fb7cd84c4adfe9f4036038ac9404c05fcb6
        run: |
          set -euo pipefail
          main_remote=$(git ls-remote origin refs/heads/main | cut -f1)
          delivery_remote=$(git ls-remote origin "refs/heads/$DELIVERY_BRANCH" | cut -f1)
          test "$main_remote" = "$EXPECTED_MAIN"
          test "$delivery_remote" = "$EXPECTED_MAIN"
          git config user.name "polodev"
          git config user.email "polodev10@gmail.com"
          git add \
            02-easy-hindi-intermediate/chapters/ch011.json \
            02-easy-hindi-intermediate/chapters/ch012.json \
            02-easy-hindi-intermediate/chapters/ch013.json \
            02-easy-hindi-intermediate/chapters/ch014.json \
            02-easy-hindi-intermediate/chapters/ch015.json \
            02-easy-hindi-intermediate/chapters/ch016.json \
            02-easy-hindi-intermediate/chapters/ch017.json \
            02-easy-hindi-intermediate/chapters/ch018.json \
            02-easy-hindi-intermediate/chapters/ch019.json \
            02-easy-hindi-intermediate/chapters/ch020.json \
            02-easy-hindi-intermediate/authoring-progress.json
          git diff --cached --name-status
          test "$(git diff --cached --name-only | wc -l)" -eq 11
          test "$(git diff --cached --diff-filter=A --name-only | wc -l)" -eq 11
          test -z "$(git diff --cached --diff-filter=MDR --name-only)"
          ts=$(TZ=Asia/Dhaka date '+%a %b %-d, %-I:%M%P')
          git commit -m "$ts — 11 files added"
          commit_sha=$(git rev-parse HEAD)
          git push origin HEAD:"$DELIVERY_BRANCH"
          remote_sha=$(git ls-remote origin "refs/heads/$DELIVERY_BRANCH" | cut -f1)
          test "$remote_sha" = "$commit_sha"
          git push origin --delete "$TRANSFER_BRANCH" || true
