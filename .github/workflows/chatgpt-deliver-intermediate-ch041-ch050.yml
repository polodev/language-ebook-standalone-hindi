name: Deliver Easy Hindi Intermediate chapters 41-50

on:
  push:
    branches:
      - content/02-easy-hindi-intermediate/ch041-ch050
    paths:
      - '.github/transfer/intermediate-ch041-ch050.py.gz.b64'
      - '.github/workflows/chatgpt-deliver-intermediate-ch041-ch050.yml'

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: content/02-easy-hindi-intermediate/ch041-ch050

      - name: Verify base and reconstruct generator
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "d79a0fb7cd84c4adfe9f4036038ac9404c05fcb6"
          base64 -d .github/transfer/intermediate-ch041-ch050.py.gz.b64 | gzip -d > /tmp/generate_intermediate_41_50.py
          python3 -m py_compile /tmp/generate_intermediate_41_50.py

      - name: Generate requested chapter source files
        shell: bash
        run: |
          set -euo pipefail
          BOOK_OUT="$GITHUB_WORKSPACE/02-easy-hindi-intermediate" python3 /tmp/generate_intermediate_41_50.py
          for n in {41..50}; do
            f=$(printf '02-easy-hindi-intermediate/chapters/ch%03d.json' "$n")
            test -s "$f"
          done
          test -s 02-easy-hindi-intermediate/authoring-progress.json

      - name: Run repository validator and record result
        shell: bash
        run: |
          set -euo pipefail
          validation_output=$(python3 scripts/manage.py validate --book 02-easy-hindi-intermediate)
          printf '%s\n' "$validation_output"
          echo "$validation_output" | grep -F '02-easy-hindi-intermediate: 10/60 authored chapters structurally valid; publication not assessed'
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('02-easy-hindi-intermediate/authoring-progress.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d['checks_performed'].append({
              'check': 'repository_validator',
              'result': 'passed',
              'command': 'python3 scripts/manage.py validate --book 02-easy-hindi-intermediate',
              'details': 'Repository validator output: 02-easy-hindi-intermediate: 10/60 authored chapters structurally valid; publication not assessed.'
          })
          d['git_delivery'] = {
              'status': 'branch_delivery_validated',
              'branch': 'content/02-easy-hindi-intermediate/ch041-ch050',
              'base_main_sha': 'd79a0fb7cd84c4adfe9f4036038ac9404c05fcb6',
              'target_branch': 'main',
              'force_push': False
          }
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Remove temporary transport and commit validated batch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/transfer/intermediate-ch041-ch050.py.gz.b64
          git rm .github/workflows/chatgpt-deliver-intermediate-ch041-ch050.yml
          git add \
            02-easy-hindi-intermediate/chapters/ch041.json \
            02-easy-hindi-intermediate/chapters/ch042.json \
            02-easy-hindi-intermediate/chapters/ch043.json \
            02-easy-hindi-intermediate/chapters/ch044.json \
            02-easy-hindi-intermediate/chapters/ch045.json \
            02-easy-hindi-intermediate/chapters/ch046.json \
            02-easy-hindi-intermediate/chapters/ch047.json \
            02-easy-hindi-intermediate/chapters/ch048.json \
            02-easy-hindi-intermediate/chapters/ch049.json \
            02-easy-hindi-intermediate/chapters/ch050.json \
            02-easy-hindi-intermediate/authoring-progress.json
          test "$(git diff --cached --diff-filter=A --name-only | wc -l)" -eq 11
          test "$(git diff --cached --diff-filter=D --name-only | wc -l)" -eq 2
          test -z "$(git diff --cached --diff-filter=MR --name-only)"
          git config user.name "polodev"
          git config user.email "polodev10@gmail.com"
          ts=$(TZ=Asia/Dhaka date '+%a %b %-d, %-I:%M%P')
          git commit -m "$ts — 11 files added, 2 temporary transfer files removed"
          git push origin HEAD:content/02-easy-hindi-intermediate/ch041-ch050

      - name: Verify final branch diff against main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main content/02-easy-hindi-intermediate/ch041-ch050
          git checkout --detach origin/content/02-easy-hindi-intermediate/ch041-ch050
          test "$(git diff --name-only origin/main...HEAD | wc -l)" -eq 11
          test "$(git diff --diff-filter=A --name-only origin/main...HEAD | wc -l)" -eq 11
          test -z "$(git diff --diff-filter=DMR --name-only origin/main...HEAD)"
          test -z "$(git diff --name-only origin/main...HEAD | grep -v '^02-easy-hindi-intermediate/' || true)"
          python3 scripts/manage.py validate --book 02-easy-hindi-intermediate
