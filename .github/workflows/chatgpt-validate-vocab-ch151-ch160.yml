name: Deliver vocabulary ch151-ch160

on:
  push:
    branches:
      - content/04-easy-hindi-vocabulary-7000-words/ch151-ch160

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore authored batch from preserved chunks
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_SHA256: 82c277b2c0a17768d569a0c674c301aac1ec0ce464737cb38008ddeca22f59f0
        run: |
          set -euo pipefail
          BOOK="04-easy-hindi-vocabulary-7000-words"
          : > /tmp/ch151-ch160.tgz
          i=0
          for sha in \
            b352facfc048ec9636471ceed4cb414457d61d69 \
            d95d628615068fd12d25cc15b72850d331e9f7f3 \
            bb7bbe8ef9d3d99ff8d2d0966b28110128bdeaa5 \
            8cc082ae7c17a06373d46a8cfb82b60aad33de55 \
            94a9fe11733448fb606552c4bf206580f7e3adea \
            9e5e716acc0f1185648d1910f67a596dec12dff8
          do
            part="/tmp/chunk-${i}.b64"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | python3 -c 'import sys,json,base64; obj=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(obj["content"]))' \
              > "${part}"
            base64 -d "${part}" >> /tmp/ch151-ch160.tgz
            i=$((i+1))
          done
          echo "${ARCHIVE_SHA256}  /tmp/ch151-ch160.tgz" | sha256sum -c -
          tar -xzf /tmp/ch151-ch160.tgz -C "$BOOK"
          for n in $(seq 151 160); do
            test -s "$BOOK/chapters/ch${n}.json"
            test -s "$BOOK/rosters/ch${n}.json"
          done
          test -s "$BOOK/authoring-progress.json"

      - name: Commit and push completed batch
        env:
          BRANCH: content/04-easy-hindi-vocabulary-7000-words/ch151-ch160
        run: |
          set -euo pipefail
          BOOK="04-easy-hindi-vocabulary-7000-words"
          git fetch origin main
          git add "$BOOK/authoring-progress.json"
          for n in $(seq 151 160); do
            git add "$BOOK/chapters/ch${n}.json" "$BOOK/rosters/ch${n}.json"
          done
          git rm .github/workflows/chatgpt-validate-vocab-ch151-ch160.yml
          mapfile -t changed < <(git diff --cached --name-only origin/main)
          test "${#changed[@]}" -eq 21
          read adds dels < <(git diff --cached --numstat origin/main | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          stamp=$(TZ=Asia/Dhaka date '+%Y-%m-%d %H:%M +06:00')
          git config user.name "ChatGPT Content Delivery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete vocabulary ch151-ch160 — ${stamp} — +${adds}/-${dels}"
          git push origin "HEAD:${BRANCH}"
