name: Recover and deliver vocabulary ch151-ch160

on:
  push:
    branches:
      - content/04-easy-hindi-vocabulary-7000-words/ch151-ch160

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover requested source files from separate preserved archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          BOOK="04-easy-hindi-vocabulary-7000-words"
          rm -rf /tmp/recover-vocab && mkdir -p /tmp/recover-vocab

          fetch_blob_text() {
            local sha="$1" out="$2"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | python3 -c 'import sys,json,base64; o=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(o["content"]))' \
              > "$out"
          }

          # First preserved archive: gzip Base64 split across blobs 0-4.
          GZIP_CHUNKS=(
            b352facfc048ec9636471ceed4cb414457d61d69
            d95d628615068fd12d25cc15b72850d331e9f7f3
            bb7bbe8ef9d3d99ff8d2d0966b28110128bdeaa5
            8cc082ae7c17a06373d46a8cfb82b60aad33de55
            94a9fe11733448fb606552c4bf206580f7e3adea
          )
          : > /tmp/recover-vocab/gzip.b64
          i=0
          for sha in "${GZIP_CHUNKS[@]}"; do
            raw="/tmp/recover-vocab/gzip-${i}.txt"
            fetch_blob_text "$sha" "$raw"
            cat "$raw" >> /tmp/recover-vocab/gzip.b64
            i=$((i+1))
          done
          base64 -d /tmp/recover-vocab/gzip.b64 > /tmp/recover-vocab/gzip.tgz 2>/dev/null || true
          mkdir -p /tmp/recover-vocab/out-gzip
          gzip -dc /tmp/recover-vocab/gzip.tgz > /tmp/recover-vocab/gzip.tar 2>/dev/null || true
          tar -xf /tmp/recover-vocab/gzip.tar -C /tmp/recover-vocab/out-gzip --ignore-zeros 2>/dev/null || true
          echo '--- gzip archive recovered files ---'
          find /tmp/recover-vocab/out-gzip -type f -printf '%P\n' | sort

          # Second preserved archive begins independently with an XZ Base64 header.
          fetch_blob_text 9e5e716acc0f1185648d1910f67a596dec12dff8 /tmp/recover-vocab/xz.b64
          base64 -d /tmp/recover-vocab/xz.b64 > /tmp/recover-vocab/xz.bin 2>/dev/null || true
          mkdir -p /tmp/recover-vocab/out-xz
          xz -dc /tmp/recover-vocab/xz.bin > /tmp/recover-vocab/xz.tar 2>/dev/null || true
          tar -xf /tmp/recover-vocab/xz.tar -C /tmp/recover-vocab/out-xz --ignore-zeros 2>/dev/null || true
          echo '--- xz archive recovered files ---'
          find /tmp/recover-vocab/out-xz -type f -printf '%P\n' | sort

          # Merge recovered members from both preserved archives.
          mkdir -p /tmp/recover-vocab/merged/chapters /tmp/recover-vocab/merged/rosters
          for root in /tmp/recover-vocab/out-gzip /tmp/recover-vocab/out-xz; do
            [ -f "$root/authoring-progress.json" ] && cp "$root/authoring-progress.json" /tmp/recover-vocab/merged/authoring-progress.json
            for n in $(seq 151 160); do
              [ -f "$root/chapters/ch${n}.json" ] && cp "$root/chapters/ch${n}.json" "/tmp/recover-vocab/merged/chapters/ch${n}.json"
              [ -f "$root/rosters/ch${n}.json" ] && cp "$root/rosters/ch${n}.json" "/tmp/recover-vocab/merged/rosters/ch${n}.json"
            done
          done

          echo '--- merged required files ---'
          find /tmp/recover-vocab/merged -type f -printf '%P\n' | sort
          test -s /tmp/recover-vocab/merged/authoring-progress.json
          for n in $(seq 151 160); do
            test -s "/tmp/recover-vocab/merged/chapters/ch${n}.json"
            test -s "/tmp/recover-vocab/merged/rosters/ch${n}.json"
          done

          cp /tmp/recover-vocab/merged/authoring-progress.json "$BOOK/authoring-progress.json"
          for n in $(seq 151 160); do
            cp "/tmp/recover-vocab/merged/chapters/ch${n}.json" "$BOOK/chapters/ch${n}.json"
            cp "/tmp/recover-vocab/merged/rosters/ch${n}.json" "$BOOK/rosters/ch${n}.json"
          done

      - name: Commit and push completed batch
        env:
          BRANCH: content/04-easy-hindi-vocabulary-7000-words/ch151-ch160
        run: |
          set -euo pipefail
          BOOK="04-easy-hindi-vocabulary-7000-words"
          git fetch origin main
          git add "$BOOK/authoring-progress.json"
          for n in $(seq 151 160); do
            git add "$BOOK/chapters/ch${n}.json" "$BOOK/rosters/ch${n}.json"
          done
          git rm .github/workflows/chatgpt-validate-vocab-ch151-ch160.yml
          mapfile -t changed < <(git diff --cached --name-only origin/main)
          test "${#changed[@]}" -eq 21
          read adds dels < <(git diff --cached --numstat origin/main | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          stamp=$(TZ=Asia/Dhaka date '+%Y-%m-%d %H:%M +06:00')
          git config user.name "ChatGPT Content Delivery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete vocabulary ch151-ch160 — ${stamp} — +${adds}/-${dels}"
          git push origin "HEAD:${BRANCH}"
