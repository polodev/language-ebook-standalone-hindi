name: Deliver vocabulary ch151-ch160

on:
  push:
    branches:
      - content/04-easy-hindi-vocabulary-7000-words/ch151-ch160

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore clean rebuilt source
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_SHA256: 771ae228e31aea7e480c41e7d1d37d3ad4533383189c21dd1a038b6ff7b4cbf5
        run: |
          set -euo pipefail
          BOOK="04-easy-hindi-vocabulary-7000-words"
          : > /tmp/vocab151-160.b64
          for sha in \
            ae22260734da242a6ace52c6b02833aa4042c3b3 \
            f8cd2887f83f2ccec54db0916c0e5db7714c72e7 \
            089cc381761a435bedc22f69c77d73475b3aa94d \
            b627fe9741a012df978a1911df6be1ae0b762133 \
            4b45acfc662a746d8a678be275395714d957cb03 \
            28a32ca69af258db63a5c67463ba0a2877ac47a2 \
            65a89ff3c69e71c3c6cd902c7eff6388a4a310e7 \
            62baa7c29d4cf1cf576369e593250c748790bed4 \
            f50f0762db8f600b705b4013e114ec1ea250619d
          do
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | python3 -c 'import sys,json,base64; o=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(o["content"]))' \
              >> /tmp/vocab151-160.b64
          done
          base64 -d /tmp/vocab151-160.b64 > /tmp/vocab151-160.tar.xz
          echo "${ARCHIVE_SHA256}  /tmp/vocab151-160.tar.xz" | sha256sum -c -
          tar -xJf /tmp/vocab151-160.tar.xz -C "$BOOK"
          for n in $(seq 151 160); do
            test -s "$BOOK/chapters/ch${n}.json"
            test -s "$BOOK/rosters/ch${n}.json"
          done
          test -s "$BOOK/authoring-progress.json"

      - name: Commit and push source files
        env:
          BRANCH: content/04-easy-hindi-vocabulary-7000-words/ch151-ch160
        run: |
          set -euo pipefail
          BOOK="04-easy-hindi-vocabulary-7000-words"
          git fetch origin main
          git add "$BOOK/authoring-progress.json"
          for n in $(seq 151 160); do
            git add "$BOOK/chapters/ch${n}.json" "$BOOK/rosters/ch${n}.json"
          done
          git rm .github/workflows/chatgpt-validate-vocab-ch151-ch160.yml
          mapfile -t changed < <(git diff --cached --name-only origin/main)
          test "${#changed[@]}" -eq 21
          read adds dels < <(git diff --cached --numstat origin/main | awk '{a+=$1; d+=$2} END {print a+0, d+0}')
          stamp=$(TZ=Asia/Dhaka date '+%Y-%m-%d %H:%M +06:00')
          git config user.name "ChatGPT Content Delivery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete vocabulary ch151-ch160 — ${stamp} — +${adds}/-${dels}"
          git push origin "HEAD:${BRANCH}"
