name: Temporary author Hindi vocabulary ch141-150

on:
  push:
    branches:
      - 'content/04-easy-hindi-vocabulary-7000-words/ch141-ch150'
    paths:
      - '04-easy-hindi-vocabulary-7000-words/_tmp_ch141_150/**'
      - '.github/workflows/tmp-author-ch141-150.yml'

permissions:
  contents: write

jobs:
  author-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependency
        run: python -m pip install Unidecode

      - name: Check whole-book baseline validator
        run: |
          set +e
          python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words > /tmp/baseline-validator.log 2>&1
          code=$?
          set -e
          cat /tmp/baseline-validator.log
          if [ "$code" -ne 0 ] && ! grep -q 'Duplicate target across vocabulary rosters' /tmp/baseline-validator.log; then
            exit "$code"
          fi
          echo "BASELINE_VALIDATOR_EXIT=$code" >> "$GITHUB_ENV"

      - name: Exclude shared danda from Bangla-script leakage audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('04-easy-hindi-vocabulary-7000-words/_tmp_ch141_150/generate.py')
          s = p.read_text(encoding='utf-8')
          old = "assert not re.search(r'[\\u0900-\\u097F]',txt)"
          new = "assert not re.search(r'[\\u0900-\\u097F]',txt.replace('।',''))"
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Generate chapters and rosters
        run: python 04-easy-hindi-vocabulary-7000-words/_tmp_ch141_150/generate.py

      - name: Normalize mixed-reading Markdown with repository logic
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.manage import mixed_reading_markdown
          root = Path('04-easy-hindi-vocabulary-7000-words/chapters')
          for n in range(141, 151):
              p = root / f'ch{n:03d}.json'
              d = json.loads(p.read_text(encoding='utf-8'))
              d['bridge_reading']['text_md'] = mixed_reading_markdown(d['bridge_reading']['segments'])
              p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Check no new roster target duplicates
        run: |
          python3 - <<'PY'
          import json, unicodedata
          from pathlib import Path
          def normalized(text):
              return ' '.join(unicodedata.normalize('NFC', text).casefold().split()).strip('.,!?।。！？')
          root = Path('04-easy-hindi-vocabulary-7000-words/rosters')
          prior = {}
          for p in sorted(root.glob('ch*.json')):
              n = int(p.stem[2:])
              if 141 <= n <= 150:
                  continue
              d = json.loads(p.read_text(encoding='utf-8'))
              for item in d.get('items', []):
                  prior.setdefault(normalized(item['target']), (item['target'], p.name))
          batch = {}
          problems = []
          for n in range(141, 151):
              p = root / f'ch{n:03d}.json'
              d = json.loads(p.read_text(encoding='utf-8'))
              for item in d['items']:
                  key = normalized(item['target'])
                  if key in prior:
                      problems.append(f"{item['target']} duplicates {prior[key][0]} in {prior[key][1]}")
                  if key in batch:
                      problems.append(f"{item['target']} duplicates batch target in {batch[key]}")
                  batch[key] = p.name
          if problems:
              raise SystemExit('New duplicate targets:\n' + '\n'.join(problems))
          print(f'No new cross-roster duplicates in {len(batch)} targets for ch141-ch150.')
          PY

      - name: Run official validator on requested batch
        run: |
          tmp=$(mktemp -d)
          tar --exclude='.git' -cf - . | (cd "$tmp" && tar -xf -)
          python3 - "$tmp" <<'PY'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1]) / '04-easy-hindi-vocabulary-7000-words'
          for folder in ['chapters', 'rosters']:
              for p in (root / folder).glob('ch*.json'):
                  n = int(p.stem[2:])
                  if not 141 <= n <= 150:
                      p.unlink()
          PY
          (cd "$tmp" && python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words)

      - name: Recheck whole-book validator without changing baseline scope
        run: |
          set +e
          python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words > /tmp/post-validator.log 2>&1
          code=$?
          set -e
          cat /tmp/post-validator.log
          if [ "$BASELINE_VALIDATOR_EXIT" -eq 0 ]; then
            [ "$code" -eq 0 ] || exit "$code"
          else
            if [ "$code" -eq 0 ]; then
              echo 'Whole-book validator now passes.'
            elif ! grep -q 'Duplicate target across vocabulary rosters' /tmp/post-validator.log; then
              exit "$code"
            else
              echo 'Whole-book validator remains blocked by the same pre-existing duplicate-roster baseline condition.'
            fi
          fi

      - name: Record validation results
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          p = Path('04-easy-hindi-vocabulary-7000-words/authoring-progress.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          for check in d['checks_performed']:
              if check.get('check') == 'repository_validator':
                  check['result'] = 'passed_for_requested_batch'
                  check['details'] = 'Official repository validator passed in an isolated repository copy containing ch141-ch150; the whole-book base validator has a pre-existing duplicate-roster failure unrelated to this batch.'
          d['checks_performed'].append({'check':'cross_roster_duplicate_audit','result':'passed','details':'Verified all 300 ch141-ch150 targets are unique within the batch and do not duplicate targets in existing base rosters.'})
          if 'Whole-book validator on the base branch already fails with: Duplicate target across vocabulary rosters.' not in d['remaining_issues']:
              d['remaining_issues'].append('Whole-book validator on the base branch already fails with: Duplicate target across vocabulary rosters.')
          d['updated_at_local'] = datetime.now(ZoneInfo('Asia/Dhaka')).isoformat(timespec='minutes')
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit generated source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 04-easy-hindi-vocabulary-7000-words/chapters/ch1{41..50}.json
          git add 04-easy-hindi-vocabulary-7000-words/rosters/ch1{41..50}.json
          git add 04-easy-hindi-vocabulary-7000-words/authoring-progress.json
          count=$(git diff --cached --name-only | wc -l | tr -d ' ')
          stamp=$(TZ=Asia/Dhaka date '+%Y-%m-%d %H:%M %z')
          git commit -m "content: vocabulary ch141-ch150 ${stamp} (${count} files)"
          git push origin HEAD
