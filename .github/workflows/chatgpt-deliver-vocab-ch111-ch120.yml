name: Deliver Easy Hindi Vocabulary chapters 111-120 review branch

on:
  push:
    branches:
      - transport/04-easy-hindi-vocabulary/ch111-ch120-20260913
    paths:
      - '.github/transfer-vocab-ch111-ch120/READY'

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    env:
      DELIVERY_BRANCH: content/04-easy-hindi-vocabulary-7000-words/ch111-ch120
      EXPECTED_MAIN: 9dbdc14b189c0d9094d3502ac616da544d24dfb1
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct authored batch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/transfer-vocab-ch111-ch120/part-* | base64 -d | xz -d > /tmp/ch111-ch120.tar
          tar -tf /tmp/ch111-ch120.tar

      - name: Verify branch bases and apply batch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          actual_main=$(git rev-parse FETCH_HEAD)
          test "$actual_main" = "$EXPECTED_MAIN"
          actual_delivery=$(git ls-remote --heads origin "refs/heads/$DELIVERY_BRANCH" | awk '{print $1}')
          test "$actual_delivery" = "$EXPECTED_MAIN"
          git checkout -B delivery "$EXPECTED_MAIN"
          tar -xf /tmp/ch111-ch120.tar
          for n in {111..120}; do
            chapter=$(printf '04-easy-hindi-vocabulary-7000-words/chapters/ch%03d.json' "$n")
            roster=$(printf '04-easy-hindi-vocabulary-7000-words/rosters/ch%03d.json' "$n")
            test -s "$chapter"
            test -s "$roster"
          done
          test -s 04-easy-hindi-vocabulary-7000-words/authoring-progress.json

      - name: Validate authored batch
        shell: bash
        run: |
          set +e
          {
            python3 - <<'PY'
          import glob, json, unicodedata
          def norm(text):
              return ' '.join(unicodedata.normalize('NFC', text).casefold().split()).strip('.,!?।。！？')
          seen = {}
          duplicates = []
          for path in sorted(glob.glob('04-easy-hindi-vocabulary-7000-words/rosters/ch*.json')):
              data = json.load(open(path, encoding='utf-8'))
              for item in data.get('items', []):
                  key = norm(item['target'])
                  here = f"{path}:{item['id']}"
                  if key in seen:
                      duplicates.append((item['target'], seen[key], here))
                  else:
                      seen[key] = here
          if duplicates:
              print('Duplicate vocabulary targets detected:')
              for target, first, second in duplicates:
                  print(f'DUPLICATE_TARGET\t{target}\t{first}\t{second}')
              raise SystemExit(2)
          print('No duplicate roster targets detected by diagnostic scan.')
          PY
            diag_status=$?
            if [ "$diag_status" -eq 0 ]; then
              python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words
            fi
          } > /tmp/validation.txt 2>&1
          status=$?
          cat /tmp/validation.txt
          if [ "$status" -ne 0 ]; then
            cp /tmp/validation.txt /tmp/validator-output.txt
            git config user.name "polodev"
            git config user.email "polodev10@gmail.com"
            git checkout -B diagnostics "$GITHUB_SHA"
            mkdir -p .github/transfer-vocab-ch111-ch120
            cp /tmp/validator-output.txt .github/transfer-vocab-ch111-ch120/validator-output.txt
            git add .github/transfer-vocab-ch111-ch120/validator-output.txt
            ts=$(TZ=Asia/Dhaka date '+%a %b %-d, %-I:%M%P')
            git commit -m "$ts — record chapters 111-120 validator diagnostics"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
            exit "$status"
          fi

      - name: Commit and push review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "polodev"
          git config user.email "polodev10@gmail.com"
          for n in {111..120}; do
            git add "$(printf '04-easy-hindi-vocabulary-7000-words/chapters/ch%03d.json' "$n")"
            git add "$(printf '04-easy-hindi-vocabulary-7000-words/rosters/ch%03d.json' "$n")"
          done
          git add 04-easy-hindi-vocabulary-7000-words/authoring-progress.json
          git diff --cached --name-status
          test "$(git diff --cached --name-only | wc -l)" -eq 21
          test -z "$(git diff --cached --diff-filter=DR --name-only)"
          added=$(git diff --cached --diff-filter=A --name-only | wc -l | tr -d ' ')
          modified=$(git diff --cached --diff-filter=M --name-only | wc -l | tr -d ' ')
          ts=$(TZ=Asia/Dhaka date '+%a %b %-d, %-I:%M%P')
          git commit -m "$ts — ${modified} files modified, ${added} files added"
          commit_sha=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/$DELIVERY_BRANCH"
          remote_sha=$(git ls-remote --heads origin "refs/heads/$DELIVERY_BRANCH" | awk '{print $1}')
          test "$remote_sha" = "$commit_sha"

      - name: Record validator output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vocabulary-ch111-ch120-validation
          path: /tmp/validation.txt
          if-no-files-found: ignore
