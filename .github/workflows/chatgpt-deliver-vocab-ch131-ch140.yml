name: Deliver vocabulary chapters 131-140

on:
  push:
    branches:
      - chatgpt-transfer-vocab-ch131-ch140-20260913
    paths:
      - '.github/transfer/READY'

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct transfer archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/transfer/ch131-140.part-* | base64 -d | xz -d > /tmp/ch131-140.tar
          tar -tf /tmp/ch131-140.tar

      - name: Extract, preserve progress, and validate
        shell: bash
        env:
          EXPECTED_MAIN: 9dbdc14b189c0d9094d3502ac616da544d24dfb1
          TARGET_BRANCH: content/04-easy-hindi-vocabulary-7000-words/ch131-ch140
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git checkout -B delivery origin/main
          tar -xf /tmp/ch131-140.tar
          for n in {131..140}; do
            c=$(printf '04-easy-hindi-vocabulary-7000-words/chapters/ch%03d.json' "$n")
            r=$(printf '04-easy-hindi-vocabulary-7000-words/rosters/ch%03d.json' "$n")
            test -s "$c"
            test -s "$r"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = "9dbdc14b189c0d9094d3502ac616da544d24dfb1"
          target = "content/04-easy-hindi-vocabulary-7000-words/ch131-ch140"
          dest = Path("04-easy-hindi-vocabulary-7000-words/authoring-progress.json")
          incoming = Path(".github/transfer/ch131-140-progress.json")
          prior = json.loads(dest.read_text(encoding="utf-8")) if dest.exists() else None
          current = json.loads(incoming.read_text(encoding="utf-8"))
          current["base_main_sha"] = base
          current["base_commit"] = base
          current["branch"] = target
          if prior is not None:
              current["preserved_prior_progress_checkpoint"] = prior
          current["git_delivery"] = {
              "status": "branch_commit_pending_validation",
              "target_branch": "main",
              "base_main_sha": base,
              "delivery_branch": target,
              "method": "GitHub Actions byte-exact temporary transport to a review branch; no direct main push.",
              "force_push": False
          }
          dest.write_text(json.dumps(current, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          rm -rf .github/transfer
          set +e
          python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words > /tmp/validate.log 2>&1
          code=$?
          set -e
          cat /tmp/validate.log
          test $code -eq 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("04-easy-hindi-vocabulary-7000-words/authoring-progress.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          out = Path("/tmp/validate.log").read_text(encoding="utf-8").strip()
          for check in d.get("checks_performed", []):
              if check.get("check") == "repository_partial_validator":
                  check["result"] = "passed"
                  check["details"] = out[-1500:] if out else "Repository partial validator passed."
          d["git_delivery"]["status"] = "validated_branch_commit_pending"
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit and push review branch
        shell: bash
        env:
          TARGET_BRANCH: content/04-easy-hindi-vocabulary-7000-words/ch131-ch140
        run: |
          set -euo pipefail
          git config user.name "polodev"
          git config user.email "polodev10@gmail.com"
          for n in {131..140}; do
            git add "$(printf '04-easy-hindi-vocabulary-7000-words/chapters/ch%03d.json' "$n")"
            git add "$(printf '04-easy-hindi-vocabulary-7000-words/rosters/ch%03d.json' "$n")"
          done
          git add 04-easy-hindi-vocabulary-7000-words/authoring-progress.json
          git diff --cached --name-status
          test "$(git diff --cached --name-only | wc -l)" -eq 21
          test "$(git diff --cached --diff-filter=A --name-only | wc -l)" -eq 20
          test "$(git diff --cached --diff-filter=M --name-only | wc -l)" -eq 1
          test -z "$(git diff --cached --diff-filter=DR --name-only)"
          ts=$(TZ=Asia/Dhaka date '+%a %b %-d, %-I:%M%P')
          git commit -m "$ts — 1 file modified, 20 files added"
          commit_sha=$(git rev-parse HEAD)
          git push origin HEAD:"$TARGET_BRANCH"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$commit_sha"

      - name: Delete temporary transfer branch
        if: success()
        shell: bash
        run: git push origin --delete chatgpt-transfer-vocab-ch131-ch140-20260913 || true
