name: Deliver corrected vocabulary chapters 131-140

on:
  push:
    branches: [chatgpt-transfer-vocab-ch131-ch140-20260913]
    paths: ['.github/transfer/READY']

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct, validate and push batch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/transfer/piece-* | base64 -d > /tmp/batch.tar.xz
          test "$(stat -c%s /tmp/batch.tar.xz)" -eq 50644
          echo '94ea932dc57660ad90953de42ed0eb98b36711b656b6029a71851627e7f7bb3c  /tmp/batch.tar.xz' | sha256sum -c -
          xz -dc /tmp/batch.tar.xz > /tmp/batch.tar
          git fetch origin main
          test "$(git rev-parse origin/main)" = '9dbdc14b189c0d9094d3502ac616da544d24dfb1'
          git checkout -B delivery origin/main
          python3 - <<'PY'
          import json, unicodedata
          from pathlib import Path
          root=Path('04-easy-hindi-vocabulary-7000-words/rosters')
          def norm(s): return ' '.join(unicodedata.normalize('NFC',s).casefold().split()).strip('.,!?।。！？')
          old=set()
          for p in root.glob('ch*.json'):
              d=json.loads(p.read_text(encoding='utf-8'))
              old.update(norm(x['target']) for x in d.get('items',[]))
          Path('/tmp/main-targets.json').write_text(json.dumps(sorted(old),ensure_ascii=False),encoding='utf-8')
          PY
          tar -xf /tmp/batch.tar
          python3 - <<'PY'
          import copy, importlib.util, json, re, unicodedata
          from pathlib import Path
          B=Path('04-easy-hindi-vocabulary-7000-words')
          repl={
          'v03904':('परिरक्षण','পরিরক্ষণ','parirakshan'),'v03907':('पुनर्संसाधन','পুনর্সংসাধন','punarsansaadhan'),
          'v03920':('कसौटी','কসৌটি','kasautee'),'v03934':('भरोसेमंदी','ভরোসেমন্দী','bharosemandee'),
          'v03955':('प्रमाणन','প্রমাণন','pramaanan'),'v03965':('निजता','নিজতা','nijataa'),
          'v03992':('रज़ामंदी','রজামন্দী','razaamandee'),'v03993':('मतभेद','মতভেদ','matbhed'),
          'v04005':('तटस्थता','তটস্থতা','tatasthataa'),'v04011':('मियाद','মিয়াদ','miyaad'),
          'v04017':('अनुमोदन','অনুমোদন','anumodan'),'v04018':('नामंजूरी','নামঞ্জূরী','naamanzuree'),
          'v04027':('प्रक्षेपण','প্রক্ষেপণ','prakshepan'),'v04063':('मुआयना','মুআয়না','muaayanaa'),
          'v04111':('नामांकन','নামাঙ্কন','naamaankan')}
          def whole(text,old,new,lo,hi):
              return re.sub(rf'(?<![{lo}-{hi}]){re.escape(old)}(?![{lo}-{hi}])',new,text)
          def patch(obj,old,new,oldbn,newbn,oldrom,newrom):
              if isinstance(obj,dict):
                  for k,v in list(obj.items()):
                      if isinstance(v,str):
                          if k in {'target','title_target','source_form','example_target','model_target','base_target','expanded_target','polished_target'}:
                              obj[k]=whole(v,old,new,'\u0900','\u097F')
                          elif 'bangla_pronunciation' in k:
                              obj[k]=whole(v,oldbn,newbn,'\u0980','\u09FF')
                          elif k=='romanization' and oldrom:
                              obj[k]=re.sub(rf'(?<![A-Za-z]){re.escape(oldrom)}(?![A-Za-z])',newrom,v)
                      else: patch(v,old,new,oldbn,newbn,oldrom,newrom)
              elif isinstance(obj,list):
                  for v in obj: patch(v,old,new,oldbn,newbn,oldrom,newrom)
          spec=importlib.util.spec_from_file_location('manage','scripts/manage.py')
          manage=importlib.util.module_from_spec(spec); spec.loader.exec_module(manage)
          touched=[]
          for n in range(131,141):
              cp=B/'chapters'/f'ch{n:03d}.json'; rp=B/'rosters'/f'ch{n:03d}.json'
              ch=json.loads(cp.read_text(encoding='utf-8')); ro=json.loads(rp.read_text(encoding='utf-8'))
              by={x['id']:x for x in ch['vocabulary']}
              for vid,(new,newbn,newrom) in repl.items():
                  if vid not in by: continue
                  item=by[vid]; old=item['target']; oldbn=item['bangla_pronunciation']; oldrom=item.get('romanization','')
                  patch(ch,old,new,oldbn,newbn,oldrom,newrom)
                  for ri in ro['items']:
                      ri['target']=whole(ri['target'],old,new,'\u0900','\u097F')
                  item=next(x for x in ch['vocabulary'] if x['id']==vid)
                  item['target']=new; item['bangla_pronunciation']=newbn; item['romanization']=newrom
                  item['word_pronunciations']=[{'target':new,'bangla_pronunciation':newbn,'separator_after':''}]
                  s=next(x for x in ch['sentences'] if x['id']==item['source_sentence_id'])
                  item['example_target']=s['target']; item['example_bangla_pronunciation']=s['bangla_pronunciation']; item['example_word_pronunciations']=copy.deepcopy(s['word_pronunciations'])
                  touched.append((vid,old,new))
              ch['bridge_reading']['text_md']=manage.mixed_reading_markdown(ch['bridge_reading']['segments'])
              cp.write_text(json.dumps(ch,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              rp.write_text(json.dumps(ro,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('REPLACEMENTS',len(touched)); [print('REPLACED',*x) for x in touched]; assert len(touched)==15
          def norm(s): return ' '.join(unicodedata.normalize('NFC',s).casefold().split()).strip('.,!?।。！？')
          baseline=set(json.loads(Path('/tmp/main-targets.json').read_text(encoding='utf-8')))
          batch=[]
          for n in range(131,141):
              r=json.loads((B/'rosters'/f'ch{n:03d}.json').read_text(encoding='utf-8'))
              batch += [(f'ch{n:03d}',x['id'],x['target']) for x in r['items']]
          seen={}; dups=[]
          for x in batch:
              k=norm(x[2])
              if k in seen: dups.append((seen[k],x))
              else: seen[k]=x
          print('BATCH_DUPLICATES',len(dups)); [print('BATCH_DUP',x) for x in dups]; assert not dups
          cols=[x for x in batch if norm(x[2]) in baseline]
          print('NEW_COLLISIONS_AGAINST_MAIN',len(cols)); [print('COLLISION',x) for x in cols]; assert not cols
          book=manage.read(B/'book.json'); plans={p['chapter_id']:p for p in book['chapters']}
          for n in range(131,141):
              cid=f'ch{n:03d}'; ch=manage.read(B/'chapters'/f'{cid}.json'); ro=manage.read(B/'rosters'/f'{cid}.json')
              vocab=manage.validate_chapter(book,plans[cid],ch,{})
              assert ro['status']=='reviewed', cid+' roster status'
              assert [x['id'] for x in ro['items']]==plans[cid]['reserved_item_ids'], cid+' roster IDs'
              assert [x['target'] for x in vocab]==[x['target'] for x in ro['items']], cid+' roster/chapter targets'
              print('VALIDATED',cid)
          print('BATCH_CHAPTER_VALIDATION PASSED 10/10')
          dest=B/'authoring-progress.json'; prior=json.loads(dest.read_text(encoding='utf-8')) if dest.exists() else None
          incoming=json.loads(Path('.github/transfer/ch131-140-progress.json').read_text(encoding='utf-8'))
          incoming.update({'base_main_sha':'9dbdc14b189c0d9094d3502ac616da544d24dfb1','branch':'content/04-easy-hindi-vocabulary-7000-words/ch131-ch140','status':'batch_complete','unfinished_ids':[]})
          incoming['remaining_issues']=['The whole-book validator still encounters historical duplicate roster targets already present on main; ch131-ch140 adds zero new cross-roster collisions.']
          incoming['checks_performed']=[{'check':'assigned_batch_repository_schema_validation','result':'passed','details':'Repository validate_chapter logic passed ch131-ch140: 10/10.'},{'check':'cross_roster_incremental_uniqueness','result':'passed','details':'All 300 batch targets are unique within ch131-ch140 and add zero collisions against main.'},{'check':'collision_corrections','result':'passed','details':'Corrected 15 initially colliding targets and dependent annotated fields.'}]
          incoming['git_delivery']={'status':'validated_branch_commit_pending','target_branch':'main','delivery_branch':'content/04-easy-hindi-vocabulary-7000-words/ch131-ch140','base_main_sha':'9dbdc14b189c0d9094d3502ac616da544d24dfb1','force_push':False}
          if prior is not None: incoming['preserved_prior_progress_checkpoint']=prior
          dest.write_text(json.dumps(incoming,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name polodev
          git config user.email polodev10@gmail.com
          for n in {131..140}; do git add "$(printf '04-easy-hindi-vocabulary-7000-words/chapters/ch%03d.json' "$n")" "$(printf '04-easy-hindi-vocabulary-7000-words/rosters/ch%03d.json' "$n")"; done
          git add 04-easy-hindi-vocabulary-7000-words/authoring-progress.json
          test "$(git diff --cached --name-only | wc -l)" -eq 21
          test "$(git diff --cached --diff-filter=A --name-only | wc -l)" -eq 20
          test "$(git diff --cached --diff-filter=M --name-only | wc -l)" -eq 1
          git diff --cached --name-status
          ts=$(TZ=Asia/Dhaka date '+%a %b %-d, %-I:%M%p')
          git commit -m "$ts — 1 file modified, 20 files added"
          sha=$(git rev-parse HEAD)
          git push origin HEAD:content/04-easy-hindi-vocabulary-7000-words/ch131-ch140
          git fetch origin content/04-easy-hindi-vocabulary-7000-words/ch131-ch140
          test "$(git rev-parse origin/content/04-easy-hindi-vocabulary-7000-words/ch131-ch140)" = "$sha"
          echo DELIVERED_COMMIT=$sha
