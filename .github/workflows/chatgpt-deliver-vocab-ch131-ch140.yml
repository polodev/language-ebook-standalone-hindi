name: Diagnose vocabulary chapters 131-140

on:
  push:
    branches:
      - chatgpt-transfer-vocab-ch131-ch140-20260913
    paths:
      - '.github/transfer/READY'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find roster collisions against main
        shell: bash
        run: |
          set -euo pipefail
          cat .github/transfer/piece-* | base64 -d > /tmp/ch131-140.tar.xz
          echo '94ea932dc57660ad90953de42ed0eb98b36711b656b6029a71851627e7f7bb3c  /tmp/ch131-140.tar.xz' | sha256sum -c -
          xz -d -c /tmp/ch131-140.tar.xz > /tmp/ch131-140.tar
          git fetch origin main
          git checkout -B diagnose origin/main
          tar -xf /tmp/ch131-140.tar
          python3 - <<'PY'
          import json, unicodedata
          from pathlib import Path
          root = Path('04-easy-hindi-vocabulary-7000-words/rosters')
          def norm(s):
              return ' '.join(unicodedata.normalize('NFC', s).casefold().split()).strip('.,!?।。！？')
          seen = {}
          collisions = []
          for path in sorted(root.glob('ch*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              for item in data.get('items', []):
                  key = norm(item['target'])
                  if key in seen:
                      collisions.append((item['target'], seen[key], f'{path.name}:{item["id"]}'))
                  else:
                      seen[key] = f'{path.name}:{item["id"]}'
          print('COLLISION_COUNT', len(collisions))
          for target, first, second in collisions:
              print('DUPLICATE', repr(target), first, second)
          PY
