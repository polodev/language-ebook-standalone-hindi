name: Check vocabulary replacement candidates

on:
  push:
    branches:
      - chatgpt-transfer-vocab-ch131-ch140-20260913
    paths:
      - '.github/transfer/READY'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check candidate uniqueness against main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B check origin/main
          python3 - <<'PY'
          import json, unicodedata
          from pathlib import Path
          candidates = {
            'v03904':'परिरक्षण',
            'v03907':'पुनर्संसाधन',
            'v03920':'कसौटी',
            'v03934':'भरोसेमंदी',
            'v03955':'प्रमाणीकरण',
            'v03965':'निजता',
            'v03992':'रज़ामंदी',
            'v03993':'मतभेद',
            'v04005':'तटस्थता',
            'v04011':'मियाद',
            'v04017':'अनुमोदन',
            'v04018':'नामंजूरी',
            'v04027':'प्रक्षेपण',
            'v04063':'पर्यवेक्षण',
            'v04111':'नामांकन',
          }
          def norm(s):
              return ' '.join(unicodedata.normalize('NFC', s).casefold().split()).strip('.,!?।。！？')
          existing={}
          for p in Path('04-easy-hindi-vocabulary-7000-words/rosters').glob('ch*.json'):
              d=json.loads(p.read_text(encoding='utf-8'))
              for x in d.get('items',[]): existing.setdefault(norm(x['target']),[]).append(f"{p.name}:{x['id']}")
          for vid,t in candidates.items():
              print(vid, repr(t), 'USED' if norm(t) in existing else 'FREE', existing.get(norm(t),[]))
          PY
