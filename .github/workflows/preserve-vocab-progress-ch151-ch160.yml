name: Preserve vocabulary progress history ch151-ch160

on:
  push:
    branches:
      - content/04-easy-hindi-vocabulary-7000-words/ch151-ch160

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve prior progress and push
        env:
          BRANCH: content/04-easy-hindi-vocabulary-7000-words/ch151-ch160
        run: |
          set -euo pipefail
          BOOK="04-easy-hindi-vocabulary-7000-words"
          PROGRESS="$BOOK/authoring-progress.json"
          git fetch origin main
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          p = Path('04-easy-hindi-vocabulary-7000-words/authoring-progress.json')
          current = json.loads(p.read_text(encoding='utf-8'))
          old_text = subprocess.check_output([
              'git','show','origin/main:04-easy-hindi-vocabulary-7000-words/authoring-progress.json'
          ], text=True)
          old = json.loads(old_text)
          current['preserved_prior_progress_checkpoint'] = old
          p.write_text(json.dumps(current, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git add "$PROGRESS"
          git rm .github/workflows/preserve-vocab-progress-ch151-ch160.yml
          git config user.name "ChatGPT Content Delivery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve prior vocabulary authoring progress for ch151-ch160"
          git push origin "HEAD:${BRANCH}"
