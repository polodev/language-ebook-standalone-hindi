name: retry-vocab-ch221-ch230
on:
  push:
    branches:
      - content/04-easy-hindi-vocabulary-7000-words/ch221-ch230
permissions:
  contents: write
jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/04-easy-hindi-vocabulary-7000-words/ch221-ch230
          fetch-depth: 0
      - name: Recover generator and fix helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-vocab-ch221-ch230.yml').read_text()
          start="          cat > /tmp/generate.py <<'PY'\n"
          end="          PY\n          python3 /tmp/generate.py"
          body=p.split(start,1)[1].split(end,1)[0]
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())+'\n'
          body=body.replace("def fp(s): return ' '.join(bn(m.group(1)) for m in re.finditer(r'\\S+',s))","def fp(s): return ' '.join(bn(m.group(0)) for m in re.finditer(r'\\S+',s))")
          Path('/tmp/generate.py').write_text(body)
          PY
          python3 /tmp/generate.py
      - name: Validate repository book
        run: python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words
      - name: Record validator pass
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('04-easy-hindi-vocabulary-7000-words/authoring-progress.json')
          d=json.loads(p.read_text())
          for c in d['checks_performed']:
              if c['check'].startswith('python3 scripts/manage.py validate'):
                  c['result']='passed'
                  c['details']='Repository validator passed on the generated branch checkout before delivery commit.'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit validated batch and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/build-vocab-ch221-ch230.yml .github/workflows/retry-vocab-ch221-ch230.yml
          git add 04-easy-hindi-vocabulary-7000-words/chapters/ch22{1,2,3,4,5,6,7,8,9}.json 04-easy-hindi-vocabulary-7000-words/chapters/ch230.json
          git add 04-easy-hindi-vocabulary-7000-words/rosters/ch22{1,2,3,4,5,6,7,8,9}.json 04-easy-hindi-vocabulary-7000-words/rosters/ch230.json
          git add 04-easy-hindi-vocabulary-7000-words/authoring-progress.json
          git commit -m "Complete Hindi vocabulary chapters 221-230"
          git push origin HEAD:content/04-easy-hindi-vocabulary-7000-words/ch221-ch230