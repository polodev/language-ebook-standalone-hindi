name: Temporary ch181-ch190 generation and validation

on:
  push:
    branches:
      - content/04-easy-hindi-vocabulary-7000-words/ch181-ch190

permissions:
  contents: write

jobs:
  generate-validate-commit:
    if: ${{ !contains(github.event.head_commit.message, 'Complete Hindi vocabulary chapters 181-190') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct generator
        run: |
          cat .tmp-ch181-190/payload_*.txt | base64 -d | gzip -d > /tmp/gen_ch181_190.py
          sed -i "s#OUT = Path('/mnt/data/hindi_ch181_190')#OUT = Path('.')#" /tmp/gen_ch181_190.py
          python3 -m pip install --quiet Unidecode
      - name: Generate requested batch
        run: python3 /tmp/gen_ch181_190.py
      - name: Validate requested book
        run: python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words
      - name: Run repository tests
        run: python3 -m unittest discover -s tests
      - name: Commit generated source files
        run: |
          rm -rf .tmp-ch181-190
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 04-easy-hindi-vocabulary-7000-words .tmp-ch181-190
          git commit -m "Complete Hindi vocabulary chapters 181-190"
          git push origin HEAD
