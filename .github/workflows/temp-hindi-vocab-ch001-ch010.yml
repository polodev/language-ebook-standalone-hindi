name: Temporary Hindi vocabulary ch001-ch010 delivery

on:
  push:
    branches:
      - transport/04-easy-hindi-vocab-ch001-ch010-20260912

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode authoring generator
        run: |
          cat .github/.tmp-hindi-vocab/gen.part1 .github/.tmp-hindi-vocab/gen.part2 .github/.tmp-hindi-vocab/gen.part3 \
            | tr -d '[:space:]' | base64 -d | gzip -dc > /tmp/generate_hindi_vocab.py
          echo 'f5ea14dc94b2a77026aa9f0211152cee87e60882e368bd3726772b2eef85d8be  /tmp/generate_hindi_vocab.py' | sha256sum -c -
          python3 -m py_compile /tmp/generate_hindi_vocab.py

      - name: Generate, validate, and push clean batch branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE_MAIN_SHA=$(git rev-parse origin/main)
          git checkout -B authoring-work "$BASE_MAIN_SHA"
          python3 /tmp/generate_hindi_vocab.py
          python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words
          BASE_MAIN_SHA="$BASE_MAIN_SHA" VALIDATION_PASSED=1 python3 /tmp/generate_hindi_vocab.py

          git checkout -B content/04-easy-hindi-vocabulary-7000-words/ch001-ch010 "$BASE_MAIN_SHA"
          git add 04-easy-hindi-vocabulary-7000-words/chapters/ch0{01..10}.json
          git add 04-easy-hindi-vocabulary-7000-words/rosters/ch0{01..10}.json
          git add 04-easy-hindi-vocabulary-7000-words/authoring-progress.json

          files=$(git diff --cached --name-only | wc -l | tr -d ' ')
          additions=$(git diff --cached --numstat | awk '{a += $1} END {print a+0}')
          deletions=$(git diff --cached --numstat | awk '{d += $2} END {print d+0}')
          test "$files" -eq 21

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          stamp=$(TZ=Asia/Dhaka date '+%Y-%m-%d %H:%M %z')
          git commit -m "Add Hindi vocabulary ch001-ch010 (${files} files, +${additions}/-${deletions}; ${stamp})"
          git push origin HEAD:refs/heads/content/04-easy-hindi-vocabulary-7000-words/ch001-ch010
