name: Diagnose Hindi vocabulary 211-220 collisions

on:
  push:
    branches:
      - content/04-easy-hindi-vocabulary-7000-words/ch211-ch220

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/04-easy-hindi-vocabulary-7000-words/ch211-ch220
      - name: Reconstruct generator
        shell: bash
        run: |
          cat .chatgpt-tmp/vocab211-220/gzchunk_00.b64 .chatgpt-tmp/vocab211-220/gzchunk_01.b64 .chatgpt-tmp/vocab211-220/gzchunk_02.b64 .chatgpt-tmp/vocab211-220/gzchunk_03.b64 .chatgpt-tmp/vocab211-220/gzchunk_04.b64 | tr -d '\r\n\t ' | base64 -d | gzip -dc > .chatgpt-tmp/generate_211_220.py
          echo '5cab2ba8418d656adf8dbb8a857705d84028fcaccccfbc9412a1592081551073  .chatgpt-tmp/generate_211_220.py' | sha256sum -c -
      - name: Generate
        run: python3 .chatgpt-tmp/generate_211_220.py
      - name: List all collisions
        shell: bash
        run: |
          python3 - <<'PY'
          import json, unicodedata
          from pathlib import Path
          def norm(text):
              return ' '.join(unicodedata.normalize('NFC', text).casefold().split()).strip('.,!?।。！？')
          root=Path('04-easy-hindi-vocabulary-7000-words/rosters')
          baseline={}
          for p in sorted(root.glob('ch*.json')):
              n=int(p.stem[2:])
              if 211 <= n <= 220: continue
              for item in json.loads(p.read_text(encoding='utf-8'))['items']:
                  baseline.setdefault(norm(item['target']), []).append((item['target'],str(p),item['id']))
          fresh={}; collisions=[]; within=[]
          for n in range(211,221):
              p=root/f'ch{n:03d}.json'
              for item in json.loads(p.read_text(encoding='utf-8'))['items']:
                  k=norm(item['target'])
                  if k in fresh: within.append((item['target'],fresh[k],str(p),item['id']))
                  fresh[k]=(str(p),item['id'])
                  if k in baseline: collisions.append((item['target'],str(p),item['id'],baseline[k]))
          print('NEW_VS_BASELINE_COLLISIONS',len(collisions))
          for x in collisions: print(repr(x))
          print('WITHIN_BATCH_DUPLICATES',len(within))
          for x in within: print(repr(x))
          print('FRESH_COUNT',len(fresh))
          if collisions or within or len(fresh)!=300: raise SystemExit(1)
          PY
