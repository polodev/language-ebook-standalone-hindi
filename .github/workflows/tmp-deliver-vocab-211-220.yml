name: Temporary delivery - Hindi vocabulary 211-220

on:
  push:
    branches:
      - content/04-easy-hindi-vocabulary-7000-words/ch211-ch220

permissions:
  contents: write

jobs:
  deliver:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: content/04-easy-hindi-vocabulary-7000-words/ch211-ch220
          fetch-depth: 0

      - name: Reconstruct checked generator
        shell: bash
        run: |
          cat \
            .chatgpt-tmp/vocab211-220/gzchunk_00.b64 \
            .chatgpt-tmp/vocab211-220/gzchunk_01.b64 \
            .chatgpt-tmp/vocab211-220/gzchunk_02.b64 \
            .chatgpt-tmp/vocab211-220/gzchunk_03.b64 \
            .chatgpt-tmp/vocab211-220/gzchunk_04.b64 \
            | tr -d '\r\n\t ' | base64 -d | gzip -dc > .chatgpt-tmp/generate_211_220.py
          echo '5cab2ba8418d656adf8dbb8a857705d84028fcaccccfbc9412a1592081551073  .chatgpt-tmp/generate_211_220.py' | sha256sum -c -
          test "$(wc -c < .chatgpt-tmp/generate_211_220.py | tr -d ' ')" = "49789"

      - name: Generate chapters and rosters
        run: python3 .chatgpt-tmp/generate_211_220.py

      - name: Apply collision-safe lexical corrections
        shell: bash
        run: |
          python3 - <<'PY'
          import json, runpy
          from pathlib import Path
          ns = runpy.run_path('.chatgpt-tmp/generate_211_220.py')
          bn, roman, wp, mixed_md = ns['bn'], ns['roman'], ns['wp'], ns['mixed_md']
          book = Path('04-easy-hindi-vocabulary-7000-words')
          changes = {
              211: [
                  ('v06305', 'निष्पक्षता', 'निरपेक्षता', 'নিরপেক্ষতা', 'নিরপেক্ষতা'),
                  ('v06313', 'पक्षपात', 'पूर्वाग्रह', 'পক্ষপাত', 'পূর্বাগ্রহ'),
                  ('v06315', 'विश्वसनीयता', 'सत्यापनयोग्यता', 'বিশ্বাসযোগ্যতা', 'যাচাইযোগ্যতা'),
                  ('v06329', 'असहमति', 'मतभिन्नता', 'মতভেদ', 'মতভিন্নতা'),
              ],
              212: [('v06343', 'परामर्श', 'मंत्रणा', 'পরামর্শ', 'মন্ত্রণা')],
              218: [('v06515', 'गोपनीयता', 'डेटा-संरक्षण', 'গোপনীয়তা', 'ডেটা সুরক্ষা')],
          }
          def replace_all(value, replacements):
              if isinstance(value, str):
                  for old, new in replacements:
                      value = value.replace(old, new)
                  return value
              if isinstance(value, list):
                  return [replace_all(x, replacements) for x in value]
              if isinstance(value, dict):
                  return {k: replace_all(v, replacements) for k, v in value.items()}
              return value
          def refresh_annotation(obj, target_key='target', pron_key='bangla_pronunciation', words_key='word_pronunciations', roman_key=None):
              if target_key not in obj:
                  return
              target = obj[target_key]
              obj[pron_key] = bn(target)
              obj[words_key] = wp(target)
              if roman_key and roman_key in obj:
                  obj[roman_key] = roman(target)
          for n, specs in changes.items():
              cpath = book / 'chapters' / f'ch{n:03d}.json'
              rpath = book / 'rosters' / f'ch{n:03d}.json'
              ch = json.loads(cpath.read_text(encoding='utf-8'))
              ro = json.loads(rpath.read_text(encoding='utf-8'))
              replacements = []
              for _vid, old, new, old_bn_meaning, new_bn_meaning in specs:
                  replacements.append((old, new))
                  if old_bn_meaning != new_bn_meaning:
                      replacements.append((old_bn_meaning, new_bn_meaning))
              ch = replace_all(ch, replacements)
              ro = replace_all(ro, replacements)
              ch['title_bangla_pronunciation'] = bn(ch['title_target'])
              ch['title_word_pronunciations'] = wp(ch['title_target'])
              for s in ch['sentences']:
                  refresh_annotation(s, roman_key='romanization')
              for v in ch['vocabulary']:
                  refresh_annotation(v, roman_key='romanization')
                  refresh_annotation(v, 'example_target', 'example_bangla_pronunciation', 'example_word_pronunciations')
                  for group in ('synonyms', 'collocations'):
                      for item in v.get(group, []):
                          refresh_annotation(item)
              for seg in ch['bridge_reading']['segments']:
                  if seg['kind'] == 'target':
                      refresh_annotation(seg)
              ch['bridge_reading']['text_md'] = mixed_md(ch['bridge_reading']['segments'])
              for line in ch['target_reading']['lines']:
                  refresh_annotation(line)
              ch['target_reading']['bangla_pronunciation'] = ' '.join(x['bangla_pronunciation'] for x in ch['target_reading']['lines'])
              if ch.get('number_practice'):
                  for item in ch['number_practice']:
                      refresh_annotation(item)
              for task in ch['speaking_practice']:
                  refresh_annotation(task, 'model_target', 'model_bangla_pronunciation', 'model_word_pronunciations')
              for item in ch.get('additional_practice', []):
                  for key in ('base', 'expanded', 'polished'):
                      refresh_annotation(item, key + '_target', key + '_bangla_pronunciation', key + '_word_pronunciations')
              by_id = {x['id']: x for x in ch['vocabulary']}
              roster_by_id = {x['id']: x for x in ro['items']}
              for vid, _old, new, _old_bn_meaning, _new_bn_meaning in specs:
                  assert by_id[vid]['target'] == new
                  assert roster_by_id[vid]['target'] == new
              cpath.write_text(json.dumps(ch, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              rpath.write_text(json.dumps(ro, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Applied six collision-safe lexical corrections with regenerated pronunciation/romanization metadata.')
          PY

      - name: Verify new vocabulary uniqueness against baseline
        shell: bash
        run: |
          python3 - <<'PY'
          import json, unicodedata
          from pathlib import Path
          def norm(text):
              return ' '.join(unicodedata.normalize('NFC', text).casefold().split()).strip('.,!?।。！？')
          root = Path('04-easy-hindi-vocabulary-7000-words/rosters')
          baseline = {}
          for path in sorted(root.glob('ch*.json')):
              num = int(path.stem[2:])
              if 211 <= num <= 220:
                  continue
              for item in json.loads(path.read_text(encoding='utf-8'))['items']:
                  baseline.setdefault(norm(item['target']), (item['target'], str(path)))
          fresh = {}
          for n in range(211, 221):
              path = root / f'ch{n:03d}.json'
              for item in json.loads(path.read_text(encoding='utf-8'))['items']:
                  key = norm(item['target'])
                  if key in fresh:
                      raise SystemExit(f"Duplicate target inside new batch {item['target']!r}: {fresh[key]} and {path}")
                  if key in baseline:
                      _old_target, old_path = baseline[key]
                      raise SystemExit(f"New target collides with baseline {item['target']!r}: {old_path} and {path}")
                  fresh[key] = str(path)
          if len(fresh) != 300:
              raise SystemExit(f'Expected 300 unique new targets, got {len(fresh)}')
          print('New-batch uniqueness passed: 300/300 targets unique and absent from prior rosters')
          PY

      - name: Run official validator and isolate pre-existing main blocker
        shell: bash
        run: |
          set +e
          python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words > /tmp/branch-validator.txt 2>&1
          BRANCH_RC=$?
          set -e
          cat /tmp/branch-validator.txt
          if [ "$BRANCH_RC" -eq 0 ]; then
            echo 'Official repository partial validator passed on batch branch.'
            echo 'validator_status=passed' >> "$GITHUB_ENV"
          else
            git worktree add --detach /tmp/main-check origin/main
            set +e
            (cd /tmp/main-check && python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words) > /tmp/main-validator.txt 2>&1
            MAIN_RC=$?
            set -e
            echo '--- clean origin/main validator output ---'
            cat /tmp/main-validator.txt
            if [ "$MAIN_RC" -eq 0 ]; then
              echo 'Batch branch validator failed while clean origin/main passed.' >&2
              exit 1
            fi
            if ! cmp -s /tmp/branch-validator.txt /tmp/main-validator.txt; then
              echo 'Batch validator failure differs from clean origin/main failure.' >&2
              diff -u /tmp/main-validator.txt /tmp/branch-validator.txt || true
              exit 1
            fi
            echo 'Official validator is blocked by the identical pre-existing origin/main failure; validator code was not modified.'
            echo 'validator_status=baseline_blocked' >> "$GITHUB_ENV"
          fi

      - name: Install repository Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run tooling unit tests
        run: python3 -m unittest discover -s tests

      - name: Verify assigned output contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          book = Path('04-easy-hindi-vocabulary-7000-words')
          vocab_ids = []
          for n in range(211, 221):
              cid = f'ch{n:03d}'
              cpath = book / 'chapters' / f'{cid}.json'
              rpath = book / 'rosters' / f'{cid}.json'
              assert cpath.exists() and rpath.exists(), cid
              ch = json.loads(cpath.read_text(encoding='utf-8'))
              ro = json.loads(rpath.read_text(encoding='utf-8'))
              assert ch['chapter_id'] == cid
              assert ch['status'] == 'drafted'
              assert ro['status'] == 'reviewed'
              assert len(ch['sentences']) == 20
              assert len(ch['vocabulary']) == 30
              assert len(ch['script_practice']) == 5
              assert ch['number_practice'] is None
              assert len(ch['speaking_practice']) == 6
              assert len(ch['image_prompts']) == 2
              assert [x['target'] for x in ch['vocabulary']] == [x['target'] for x in ro['items']]
              vocab_ids.extend(x['id'] for x in ch['vocabulary'])
          assert vocab_ids == [f'v{i:05d}' for i in range(6301, 6601)]
          print('Assigned contract verified: ch211-ch220, v06301-v06600')
          PY

      - name: Record remote validation result
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('04-easy-hindi-vocabulary-7000-words/authoring-progress.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          checks = data.setdefault('checks_performed', [])
          status = os.environ.get('validator_status', 'unknown')
          checks.append({'check':'new_batch_cross_chapter_uniqueness','result':'passed','details':'Verified all 300 ch211-ch220 targets are unique inside the batch and absent from previously authored roster targets after replacing six detected collisions.'})
          if status == 'passed':
              checks.append({'check':'repository_partial_validator_remote','result':'passed','command':'python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words','details':'Passed in the GitHub Actions checkout before delivery.'})
          else:
              checks.append({'check':'repository_partial_validator_remote','result':'blocked_by_preexisting_main_issue','command':'python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words','details':"The unmodified validator fails identically on this branch and clean origin/main at the pre-existing duplicate roster target 'बाज़ार' in ch007/ch011. The ch211-ch220 batch itself passed the separate 300-target uniqueness audit."})
          checks.append({'check':'tooling_unit_tests_remote','result':'passed','command':'python3 -m unittest discover -s tests','details':'Repository pinned Python dependencies were installed from requirements.txt and the tooling unit tests passed in GitHub Actions before delivery.'})
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit validated delivery and remove temporary transport
        shell: bash
        env:
          BRANCH: content/04-easy-hindi-vocabulary-7000-words/ch211-ch220
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git rm .chatgpt-tmp/vocab211-220/*.b64 .github/workflows/tmp-deliver-vocab-211-220.yml .github/workflows/tmp-diagnose-vocab-211-220.yml
          for n in $(seq -w 211 220); do
            git add "04-easy-hindi-vocabulary-7000-words/chapters/ch${n}.json"
            git add "04-easy-hindi-vocabulary-7000-words/rosters/ch${n}.json"
          done
          git add 04-easy-hindi-vocabulary-7000-words/authoring-progress.json
          FILES=$(git diff --name-only origin/main | wc -l | tr -d ' ')
          ADDS=$(git diff --numstat origin/main | awk '{a+=$1} END {print a+0}')
          DELS=$(git diff --numstat origin/main | awk '{d+=$2} END {print d+0}')
          test "$FILES" = "21"
          STAMP=$(TZ=Asia/Dhaka date '+%Y-%m-%d %H:%M %z')
          git commit -m "Complete Hindi vocabulary ch211-ch220 | ${STAMP} | ${FILES} files +${ADDS}/-${DELS}"
          git push origin HEAD:"${BRANCH}"
