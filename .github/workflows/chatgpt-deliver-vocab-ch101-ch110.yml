name: Deliver vocabulary chapters 101-110

on:
  push:
    branches:
      - content/04-easy-hindi-vocabulary-7000-words/ch101-ch110
    paths:
      - '.github/transfer-vocab101-110/READY'

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          ref: content/04-easy-hindi-vocabulary-7000-words/ch101-ch110
          fetch-depth: 0

      - name: Verify base and reconstruct chapter archive
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "9dbdc14b189c0d9094d3502ac616da544d24dfb1"
          cat .github/transfer-vocab101-110/ch101-110.part-* > /tmp/ch101-110.tar.xz.b64
          test "$(wc -c < /tmp/ch101-110.tar.xz.b64)" -eq 58984
          echo "fbc2905a2032219b2e9f15057872de031b56feaf664963a5b67e6b211c375419  /tmp/ch101-110.tar.xz.b64" | sha256sum -c -
          base64 -d /tmp/ch101-110.tar.xz.b64 > /tmp/ch101-110.tar.xz
          xz -t /tmp/ch101-110.tar.xz
          xz -dc /tmp/ch101-110.tar.xz > /tmp/ch101-110.tar
          tar -tf /tmp/ch101-110.tar
          tar -xf /tmp/ch101-110.tar -C 04-easy-hindi-vocabulary-7000-words
          for n in $(seq 101 110); do
            f=$(printf '04-easy-hindi-vocabulary-7000-words/chapters/ch%03d.json' "$n")
            test -s "$f"
          done

      - name: Validate vocabulary book batch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words

      - name: Record truthful authoring progress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          dest = Path('04-easy-hindi-vocabulary-7000-words/authoring-progress.json')
          prior = json.loads(dest.read_text(encoding='utf-8')) if dest.exists() else None
          current = {
              'book': '04-easy-hindi-vocabulary-7000-words',
              'base_main_sha': '9dbdc14b189c0d9094d3502ac616da544d24dfb1',
              'requested_range': {'start': 'ch101', 'end': 'ch110', 'count': 10},
              'completed_ids': [f'ch{n:03d}' for n in range(101, 111)],
              'unfinished_ids': [],
              'status': 'batch_complete',
              'inventory': {
                  'chapters': 10,
                  'essential_sentences': 200,
                  'vocabulary_entries': 300,
                  'reviewed_rosters': 10,
                  'script_practice_items': 50,
                  'pure_reading_lines': 50,
                  'speaking_practice_tasks': 60,
                  'image_prompts': 20
              },
              'checks_performed': [
                  {
                      'check': 'authoring_source_review',
                      'result': 'passed',
                      'details': 'Read this book INSTRUCTIONS.md, chapter-template.json, validator logic, and the ch101-ch110 plans on current main before authoring.'
                  },
                  {
                      'check': 'batch_structure_and_pronunciation_reconstruction',
                      'result': 'passed',
                      'details': 'Verified exact sentence/vocabulary/script/reading/practice/image-prompt counts; vocabulary source links; reserved IDs/order; expression positions; exact ordered word_pronunciations reconstruction; and mixed-reading Markdown mirrors.'
                  },
                  {
                      'check': 'repository_validator',
                      'result': 'passed',
                      'command': 'python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words',
                      'details': 'Repository validator passed on the reconstructed branch including existing book content, reviewed rosters ch101-ch110, and authored chapters ch101-ch110.'
                  },
                  {
                      'check': 'image_prompt_alignment',
                      'result': 'passed',
                      'details': 'Verified exactly two reading-specific prompts per chapter with the planned bridge/target keys and explicit no-readable-text instruction.'
                  }
              ],
              'remaining_issues': [
                  'Independent native-speaker editorial review is still pending before publication.'
              ],
              'resume_point': 'Requested ch101-ch110 batch is complete. Do not start ch111 unless separately requested.',
              'updated_at_local': datetime.now(ZoneInfo('Asia/Dhaka')).isoformat(),
              'preserved_prior_progress_checkpoint': prior
          }
          dest.write_text(json.dumps(current, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit clean content branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/transfer-vocab101-110
          rm -f .github/workflows/chatgpt-deliver-vocab-ch101-ch110.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-status
          git commit -m "Add Hindi vocabulary chapters 101-110"
          commit_sha=$(git rev-parse HEAD)
          git push origin HEAD:content/04-easy-hindi-vocabulary-7000-words/ch101-ch110
          echo "Delivered commit: $commit_sha"
