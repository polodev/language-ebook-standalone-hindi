name: Deliver vocabulary chapters 101-110

on:
  push:
    branches:
      - content/04-easy-hindi-vocabulary-7000-words/ch101-ch110
    paths:
      - '.github/transfer-vocab101-110/READY'

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          ref: content/04-easy-hindi-vocabulary-7000-words/ch101-ch110
          fetch-depth: 0

      - name: Reconstruct chapter archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/transfer-vocab101-110/ch101-110.part-* > /tmp/ch101-110.tar.xz.b64
          test "$(wc -c < /tmp/ch101-110.tar.xz.b64)" -eq 58984
          echo "fbc2905a2032219b2e9f15057872de031b56feaf664963a5b67e6b211c375419  /tmp/ch101-110.tar.xz.b64" | sha256sum -c -
          base64 -d /tmp/ch101-110.tar.xz.b64 > /tmp/ch101-110.tar.xz
          xz -t /tmp/ch101-110.tar.xz
          xz -dc /tmp/ch101-110.tar.xz > /tmp/ch101-110.tar
          tar -xf /tmp/ch101-110.tar -C 04-easy-hindi-vocabulary-7000-words
          for n in $(seq 101 110); do
            test -s "$(printf '04-easy-hindi-vocabulary-7000-words/chapters/ch%03d.json' "$n")"
          done

      - name: Validate assigned chapters and rosters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import scripts.manage as manage

          root = Path('.')
          bookdir = root / '04-easy-hindi-vocabulary-7000-words'
          book = manage.read(bookdir / 'book.json')
          profile = manage.read(root / 'language.json')
          plans = {p['chapter_id']: p for p in book['chapters']}
          targets = set()
          for n in range(101, 111):
              cid = f'ch{n:03d}'
              plan = plans[cid]
              chapter = manage.read(bookdir / plan['content_file'])
              roster = manage.read(bookdir / plan['roster_file'])
              vocab = manage.validate_chapter(book, plan, chapter, profile)
              assert roster['status'] == 'reviewed', cid
              assert [x['id'] for x in roster['items']] == plan['reserved_item_ids'], cid
              assert [x['target'] for x in roster['items']] == [x['target'] for x in vocab], cid
              for item in vocab:
                  key = manage.normalized(item['target'])
                  assert key not in targets, f'duplicate inside assigned batch: {item["target"]}'
                  targets.add(key)
          print('Assigned batch validation passed: ch101-ch110')
          PY

      - name: Record authoring progress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          dest = Path('04-easy-hindi-vocabulary-7000-words/authoring-progress.json')
          prior = json.loads(dest.read_text(encoding='utf-8')) if dest.exists() else None
          current = {
            'book': '04-easy-hindi-vocabulary-7000-words',
            'requested_range': {'start': 'ch101', 'end': 'ch110', 'count': 10},
            'completed_ids': [f'ch{n:03d}' for n in range(101, 111)],
            'unfinished_ids': [],
            'status': 'batch_complete',
            'inventory': {
              'chapters': 10,
              'essential_sentences': 200,
              'vocabulary_entries': 300,
              'reviewed_rosters': 10,
              'script_practice_items': 50,
              'pure_reading_lines': 50,
              'speaking_practice_tasks': 60,
              'image_prompts': 20
            },
            'checks_performed': [
              {'check': 'assigned_batch_repository_validator', 'result': 'passed', 'details': 'Ran scripts.manage.validate_chapter using repository validator logic for every assigned chapter 101-110, plus reviewed-roster ID/order/equality and within-batch uniqueness checks.'},
              {'check': 'archive_integrity', 'result': 'passed', 'details': 'Verified transfer byte count, SHA-256, xz integrity, and presence of all ten reconstructed chapter files.'},
              {'check': 'full_book_validator', 'result': 'blocked_by_preexisting_repository_data', 'details': 'The full-book validator currently stops on duplicate targets across vocabulary rosters that already exist outside this assigned batch; this batch does not modify those earlier rosters.'}
            ],
            'remaining_issues': ['Full-book global roster uniqueness requires cleanup of pre-existing duplicate targets outside ch101-ch110.', 'Independent native-speaker editorial review remains pending before publication.'],
            'resume_point': 'Requested ch101-ch110 batch is complete; do not continue automatically.',
            'updated_at_local': datetime.now(ZoneInfo('Asia/Dhaka')).isoformat(),
            'preserved_prior_progress_checkpoint': prior
          }
          dest.write_text(json.dumps(current, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit clean branch content
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/transfer-vocab101-110
          rm -f .github/workflows/chatgpt-deliver-vocab-ch101-ch110.yml
          rm -f .github/workflows/chatgpt-diagnose-vocab-ch101-ch110.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-status
          git commit -m "Add Hindi vocabulary chapters 101-110"
          git push origin HEAD:content/04-easy-hindi-vocabulary-7000-words/ch101-ch110
