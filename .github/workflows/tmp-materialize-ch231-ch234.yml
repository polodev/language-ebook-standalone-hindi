          for chapter, patch in patches.items():
              path = Path(f'04-easy-hindi-vocabulary-7000-words/.tmp-ch{chapter}-source.json')
              data = json.loads(path.read_text(encoding='utf-8'))
              for change in patch['items']:
                  matches = [i for i,x in enumerate(data['items']) if x['target'] == change['old']]
                  if len(matches) != 1:
                      raise SystemExit(f'Expected one item match for ch{chapter}: {change["old"]}; got {len(matches)}')
                  data['items'][matches[0]] = change['new']
              for change in patch['sentences']:
                  matches = [i for i,x in enumerate(data['sentences']) if x['target'] == change['old']]
                  if len(matches) != 1:
                      raise SystemExit(f'Expected one sentence match for ch{chapter}: {change["old"]}; got {len(matches)}')
                  data['sentences'][matches[0]] = change['new']
              path.write_text(json.dumps(data, ensure_ascii=False, separators=(',',':')) + '\n', encoding='utf-8')
