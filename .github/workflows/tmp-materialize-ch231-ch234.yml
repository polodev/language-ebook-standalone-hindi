name: Materialize Hindi vocabulary ch231-ch234

on:
  push:
    branches:
      - content/04-easy-hindi-vocabulary-7000-words/ch231-ch234
    paths:
      - '.github/workflows/tmp-materialize-ch231-ch234.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v4
        with:
          ref: content/04-easy-hindi-vocabulary-7000-words/ch231-ch234
          fetch-depth: 0

      - name: Establish current-main validation baseline
        shell: bash
        run: |
          git worktree add --detach /tmp/main-baseline origin/main
          set +e
          (cd /tmp/main-baseline && python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words) > /tmp/main-validation.log 2>&1
          code=$?
          set -e
          cat /tmp/main-validation.log
          echo "BASELINE_VALIDATION_EXIT=$code" >> "$GITHUB_ENV"
          if [ "$code" -ne 0 ] && ! grep -q 'Duplicate target across vocabulary rosters' /tmp/main-validation.log; then
            echo 'Unexpected baseline validation failure' >&2
            exit 1
          fi

      - name: Resolve known cross-roster collisions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          patches = {
            231: {
              'items': [
                {'old':'सत्यापन','new':{'target':'तथ्यसत्यापन','category':'word','type':'noun','pron':'তথ্যসত্যাপন','meaning':'তথ্য যাচাইকরণ।'}},
                {'old':'संदर्भ','new':{'target':'प्रसंगविश्लेषण','category':'word','type':'noun','pron':'প্রসঙ্গবিশ্লেষণ','meaning':'প্রেক্ষাপট বিশ্লেষণ।'}},
                {'old':'पुष्टि','new':{'target':'पुष्टिकरण','category':'word','type':'noun','pron':'পুষ্টিকরণ','meaning':'নিশ্চিতকরণ।'}},
                {'old':'दावा','new':{'target':'दावापरीक्षण','category':'word','type':'noun','pron':'দাবাপরীক্ষণ','meaning':'দাবি যাচাই।'}},
                {'old':'विश्वसनीयता','new':{'target':'स्रोतविश्वसनीयता','category':'word','type':'noun','pron':'স্রোতবিশ্বাস্যতা','meaning':'উৎসের বিশ্বাসযোগ্যতা।'}},
                {'old':'उत्तरदायित्व','new':{'target':'जवाबदारी','category':'word','type':'noun','pron':'জবাবদারি','meaning':'জবাবদিহি বা দায়বদ্ধতা।'}},
                {'old':'प्रमाण','new':{'target':'तथ्याधार','category':'word','type':'noun','pron':'তথ্যাধার','meaning':'তথ্যভিত্তি।'}},
              ],
              'sentences': [
                {'old':'सत्यापन से भ्रामक दावा पहचानिए।','new':{'target':'भ्रामक दावे का दावापरीक्षण तथ्यसत्यापन से कीजिए।','roman':'bhraamk daave kaa daavaapriikssnn tthystyaapn se kiijie.','pron':'ভ্রামক দাবে কা দাবাপরীক্ষণ তথ্যসত্যাপন সে কিজিয়ে।','meaning':'বিভ্রান্তিকর দাবিকে তথ্য যাচাইয়ের মাধ্যমে পরীক্ষা করুন।'}},
