              'sentences': [
                {'old':'विनियमन में प्रशासनिक परामर्श जरूरी है।','new':{'target':'विनियमन में प्रशासनिक मंत्रणा जरूरी है।','roman':'viniymn men prshaasnik mntrnnaa jruurii hai.','pron':'বিনিয়মন মেঁ প্রশাসনিক মন্ত্রণা জরুরি হ্যায়।','meaning':'নিয়ন্ত্রণে প্রশাসনিক পরামর্শ জরুরি।'}},
