              ],
            },
            232: {
              'items': [
                {'old':'परामर्श','new':{'target':'मंत्रणा','category':'word','type':'noun','pron':'মন্ত্রণা','meaning':'পরামর্শ।'}},
                {'old':'प्राथमिकता','new':{'target':'अग्रक्रम','category':'word','type':'noun','pron':'অগ্রক্রম','meaning':'অগ্রাধিকারক্রম।'}},
                {'old':'संसाधन','new':{'target':'साधनसंपदा','category':'word','type':'noun','pron':'সাধনসম্পদা','meaning':'সম্পদসম্ভার।'}},
                {'old':'निष्पक्षता','new':{'target':'तटस्थता','category':'word','type':'noun','pron':'তটস্থতা','meaning':'নিরপেক্ষতা।'}},
              ],
              'sentences': [
                {'old':'विनियमन में प्रशासनिक परामर्श जरूरी है।','new':{'target':'विनियमन में प्रशासनिक मंत्रणा जरूरी है।','roman':'viniymn men prshaasnik mntrnnaa jruurii hai.','pron':'বিনিয়মন মেঁ প্রশাসনিক মন্ত্রণা জরুরি হ্যায়।','meaning':'নিয়ন্ত্রণে প্রশাসনিক পরামর্শ জরুরি।'}},
                {'old':'प्राथमिकता के साथ अनुपालन और निगरानी रखिए।','new':{'target':'अग्रक्रम के साथ अनुपालन और निगरानी रखिए।','roman':'agrkrm ke saath anupaaln aur nigraanii rkhie.','pron':'অগ্রক্রম কে সাথ অনুপালন অউর নিগরানি রখিয়ে।','meaning':'অগ্রাধিকারের সঙ্গে পরিপালন ও তদারকি রাখুন।'}},
                {'old':'प्रक्रियागत नियम निष्पक्षता बढ़ाते हैं।','new':{'target':'प्रक्रियागत नियम तटस्थता बढ़ाते हैं।','roman':"prkriyaagt niym tttsthtaa bddh'aate hain.",'pron':'প্রক্রিয়াগত নিয়ম তটস্থতা বঢ়াতে হ্যাঁয়।','meaning':'প্রক্রিয়াগত নিয়ম নিরপেক্ষতা বাড়ায়।'}},
                {'old':'संसाधन और व्यय का अभिलेख रखिए।','new':{'target':'साधनसंपदा और व्यय का अभिलेख रखिए।','roman':'saadhnsnpdaa aur vyy kaa abhilekh rkhie.','pron':'সাধনসম্পদা অউর ব্যয় কা অভিলেখ রখিয়ে।','meaning':'সম্পদসম্ভার ও ব্যয়ের রেকর্ড রাখুন।'}},
                {'old':'आवंटन में प्राथमिकता स्पष्ट रखिए।','new':{'target':'आवंटन में अग्रक्रम स्पष्ट रखिए।','roman':'aavnttn men agrkrm spsstt rkhie.','pron':'আবণ্টন মেঁ অগ্রক্রম স্পষ্ট রখিয়ে।','meaning':'বরাদ্দে অগ্রাধিকারক্রম স্পষ্ট রাখুন।'}},
                {'old':'प्रशासनिक परामर्श में हितधारक शामिल करें।','new':{'target':'प्रशासनिक मंत्रणा में हितधारक शामिल करें।','roman':'prshaasnik mntrnnaa men hitdhaark shaamil kren.','pron':'প্রশাসনিক মন্ত্রণা মেঁ হিতধারক শামিল করেঁ।','meaning':'প্রশাসনিক পরামর্শে অংশীজনকে অন্তর্ভুক্ত করুন।'}},
              ],
            },
            233: {
              'items': [
                {'old':'नमूना','new':{'target':'नमूनाचयन','category':'word','type':'noun','pron':'নমুনাচয়ন','meaning':'নমুনা নির্বাচন।'}},
                {'old':'पक्षपात','new':{'target':'चयनपक्षपात','category':'word','type':'noun','pron':'চয়নপক্ষপাত','meaning':'নির্বাচন-পক্ষপাত।'}},
                {'old':'व्याख्या','new':{'target':'परिणामव्याख्या','category':'word','type':'noun','pron':'পরিণামব্যাখ্যা','meaning':'ফলাফল ব্যাখ্যা।'}},
              ],
              'sentences': [
                {'old':'नमूना और चर को पहले तय करें।','new':{'target':'नमूनाचयन और चर को पहले तय करें।','roman':'nmuunaacyn aur cr ko phle ty kren.','pron':'নমুনাচয়ন অউর চর কো পহলে তয় করেঁ।','meaning':'নমুনা নির্বাচন ও ভ্যারিয়েবল আগে নির্ধারণ করুন।'}},
                {'old':'प्रतिनिधित्व में पक्षपात जाँचिए।','new':{'target':'प्रतिनिधित्व में चयनपक्षपात जाँचिए।','roman':'prtinidhitv men cynpksspaat jaancie.','pron':'প্রতিনিধিত্ব মেঁ চয়নপক্ষপাত জাঁচিয়ে।','meaning':'প্রতিনিধিত্বে নির্বাচন-পক্ষপাত যাচাই করুন।'}},
                {'old':'व्याख्या से पहले अनुमिति का आधार देखिए।','new':{'target':'परिणामव्याख्या से पहले अनुमिति का आधार देखिए।','roman':'prinnaamvyaakhyaa se phle anumiti kaa aadhaar dekhie.','pron':'পরিণামব্যাখ্যা সে পহলে অনুমিতি কা আধার দেখিয়ে।','meaning':'ফলাফল ব্যাখ্যার আগে অনুমিতির ভিত্তি দেখুন।'}},
                {'old':'समीक्षात्मक दृष्टि पक्षपात पहचानती है।','new':{'target':'समीक्षात्मक दृष्टि चयनपक्षपात पहचानती है।','roman':'smiikssaatmk drsstti cynpksspaat phcaantii hai.','pron':'সমীক্ষাত্মক দৃষ্টি চয়নপক্ষপাত পহচানতি হ্যায়।','meaning':'সমালোচনামূলক দৃষ্টি নির্বাচন-পক্ষপাত শনাক্ত করে।'}},
