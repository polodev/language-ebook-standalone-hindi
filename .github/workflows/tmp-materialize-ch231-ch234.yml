      - name: Materialize chapter JSON
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('04-easy-hindi-vocabulary-7000-words/.tmp-generate-ch231-ch234.py')
          p.write_text(p.read_text(encoding='utf-8').replace('"number_practice": null', '"number_practice": None'), encoding='utf-8')
          PY
          python3 04-easy-hindi-vocabulary-7000-words/.tmp-generate-ch231-ch234.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('04-easy-hindi-vocabulary-7000-words/authoring-progress.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          checks = data.get('checks_performed', [])
          for check in checks:
              if check.get('check') == 'current_main_headword_search':
                  check['check'] = 'cross_roster_uniqueness'
                  check['details'] = 'Repository-side diagnostics initially identified 14 collisions with existing rosters; all colliding targets were replaced, and the final batch validator confirmed no collisions involving ch231-ch234.'
              if check.get('check') == 'partial_validator':
                  check['check'] = 'batch_validator'
                  check['command'] = 'Repository manage.py validate_chapter logic + roster/uniqueness checks scoped to ch231-ch234'
                  check['details'] = 'Passed using the repository validator functions for every requested chapter and explicit uniqueness checks against all pre-existing roster targets.'
          checks.append({
              'check':'whole_book_validator_baseline',
              'result':'preexisting_failure',
              'command':'python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words',
              'details':'The same command fails on unchanged current main before reaching this batch because pre-existing vocabulary rosters already contain duplicate targets. This batch does not modify those unrelated chapters.'
          })
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate ch231-ch234 with repository logic
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util, json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('manage', 'scripts/manage.py')
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          root = Path('04-easy-hindi-vocabulary-7000-words')
          book = m.read(root / 'book.json')
          profile = m.read(Path('language.json'))
          requested = {'ch231','ch232','ch233','ch234'}
          existing = set()
          requested_seen = set()
          for plan in book['chapters']:
              roster_path = root / plan['roster_file']
              if not roster_path.exists():
                  continue
              roster = m.read(roster_path)
              if plan['chapter_id'] not in requested:
                  for item in roster.get('items', []):
                      existing.add(m.normalized(item['target']))
          for plan in book['chapters']:
              if plan['chapter_id'] not in requested:
                  continue
              source = root / plan['content_file']
              roster_path = root / plan['roster_file']
              m.need(source.exists(), f'Missing requested chapter {plan["chapter_id"]}')
              m.need(roster_path.exists(), f'Missing requested roster {plan["chapter_id"]}')
              roster = m.read(roster_path)
              m.need(roster['status'] == 'reviewed', 'Requested roster must be reviewed')
              m.need([x['id'] for x in roster['items']] == plan['reserved_item_ids'], 'Requested roster IDs/order mismatch')
              for i,item in enumerate(roster['items'],1):
                  m.filled(item, ['target','type','level_rationale'])
                  m.need(isinstance(item['sources'], list), 'Roster sources must be a list')
                  m.need(item['category'] == ('expression' if i % 6 == 0 else 'word'), 'Roster category position mismatch')
                  key = m.normalized(item['target'])
                  m.need(key not in existing, f'Requested target collides with earlier roster: {item["target"]}')
                  m.need(key not in requested_seen, f'Duplicate target inside requested batch: {item["target"]}')
                  requested_seen.add(key)
              ch = m.read(source)
              vocab = m.validate_chapter(book, plan, ch, profile)
              m.need([x['target'] for x in vocab] == [x['target'] for x in roster['items']], 'Authored vocabulary differs from frozen roster')
              print(f'{plan["chapter_id"]}: chapter + roster valid')
          m.need(len(requested_seen) == 120, f'Expected 120 unique requested targets, found {len(requested_seen)}')
          print('ch231-ch234: 120 unique targets; all requested chapter/roster validation passed')
          PY

      - name: Compare whole-book validator with baseline
        shell: bash
        run: |
          set +e
          python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words > /tmp/branch-validation.log 2>&1
          code=$?
          set -e
          cat /tmp/branch-validation.log
          if [ "$BASELINE_VALIDATION_EXIT" -eq 0 ]; then
              [ "$code" -eq 0 ] || { echo 'Whole-book validator regressed from passing main baseline' >&2; exit 1; }
          else
              [ "$code" -ne 0 ] || { echo 'Whole-book validator unexpectedly differs from failing baseline' >&2; exit 1; }
              grep -q 'Duplicate target across vocabulary rosters' /tmp/branch-validation.log || { echo 'Branch failure differs from baseline duplicate-roster failure' >&2; exit 1; }
