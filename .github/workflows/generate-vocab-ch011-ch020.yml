name: Build vocabulary chapters 11-20

on:
  push:
    branches:
      - content/04-easy-hindi-vocabulary-7000-words/ch011-ch020
    paths:
      - '.github/workflows/generate-vocab-ch011-ch020.yml'

permissions:
  contents: write

jobs:
  build-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Verify expected base
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d79a0fb7cd84c4adfe9f4036038ac9404c05fcb6 HEAD

      - name: Generate requested source files
        run: python3 .github/tmp/vocab11_20/generate.py

      - name: Validate vocabulary book
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words
          for n in $(seq -w 11 20); do
            test -s "04-easy-hindi-vocabulary-7000-words/chapters/ch0${n}.json"
            test -s "04-easy-hindi-vocabulary-7000-words/rosters/ch0${n}.json"
          done

      - name: Record validator result
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('04-easy-hindi-vocabulary-7000-words/authoring-progress.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          for check in d['checks_performed']:
              if check.get('check')=='repository_validator':
                  check['result']='passed'
                  check['command']='python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words'
                  check['details']='Passed on GitHub Actions against the repository current-main validator before the delivery commit.'
          d['updated_at_local']='2026-09-12T15:22+06:00'
          d['git_delivery']={'status':'committed_to_batch_branch','target_branch':'main','source_branch':'content/04-easy-hindi-vocabulary-7000-words/ch011-ch020','base_main_sha':'d79a0fb7cd84c4adfe9f4036038ac9404c05fcb6','force_push':False}
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words

      - name: Commit clean batch tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .github/tmp/vocab11_20 .github/workflows/generate-vocab-ch011-ch020.yml
          git add 04-easy-hindi-vocabulary-7000-words/authoring-progress.json
          for n in $(seq -w 11 20); do
            git add "04-easy-hindi-vocabulary-7000-words/chapters/ch0${n}.json"
            git add "04-easy-hindi-vocabulary-7000-words/rosters/ch0${n}.json"
          done
          test "$(git diff --cached --diff-filter=A --name-only | grep '^04-easy-hindi-vocabulary-7000-words/' | wc -l)" -eq 21
          git commit -m 'Complete Hindi vocabulary chapters 11-20'
          git push origin HEAD:${{ github.ref_name }}
