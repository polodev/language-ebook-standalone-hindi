name: Deliver advanced Hindi chapters 51-60

on:
  push:
    branches:
      - content/03-easy-hindi-advanced/ch051-ch060
    paths:
      - '.github/workflows/chatgpt-deliver-advanced-ch051-ch060.yml'

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout delivery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source batch
        shell: bash
        run: |
          set -euo pipefail
          cat .delivery_chunks/advanced-ch051-060.part-* | base64 -d | xz -d > /tmp/advanced-ch051-060.tar
          tar -tf /tmp/advanced-ch051-060.tar
          tar -xf /tmp/advanced-ch051-060.tar
          for n in {51..60}; do
            f=$(printf '03-easy-hindi-advanced/chapters/ch%03d.json' "$n")
            test -s "$f"
          done
          test -s 03-easy-hindi-advanced/authoring-progress.json
          test -s 03-easy-hindi-advanced/global-images.json

      - name: Verify base and validate batch
        shell: bash
        env:
          EXPECTED_MAIN: d79a0fb7cd84c4adfe9f4036038ac9404c05fcb6
          DELIVERY_BRANCH: content/03-easy-hindi-advanced/ch051-ch060
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          python3 scripts/manage.py validate --book 03-easy-hindi-advanced
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          p = Path('03-easy-hindi-advanced/authoring-progress.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['updated_at_local'] = datetime.now(ZoneInfo('Asia/Dhaka')).strftime('%Y-%m-%d %H:%M %z')
          command = 'python3 scripts/manage.py validate --book 03-easy-hindi-advanced'
          found = False
          for item in data.get('checks', []):
              if item.get('name') == command:
                  item['status'] = 'passed'
                  item['detail'] = 'Passed on the submitted GitHub branch against the verified latest main base.'
                  found = True
          if not found:
              data.setdefault('checks', []).append({
                  'name': command,
                  'status': 'passed',
                  'detail': 'Passed on the submitted GitHub branch against the verified latest main base.'
              })
          data['git_delivery'] = {
              'status': 'validated_on_branch',
              'branch': os.environ['DELIVERY_BRANCH'],
              'target_branch': 'main',
              'base_main_sha': os.environ['EXPECTED_MAIN'],
              'force_push': False
          }
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python3 scripts/manage.py validate --book 03-easy-hindi-advanced

      - name: Finalize clean branch diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .delivery_chunks
          rm -f .github/workflows/chatgpt-deliver-advanced-ch051-ch060.yml
          git config user.name "polodev"
          git config user.email "polodev10@gmail.com"
          git add -A
          git diff --cached --name-status
          for n in {51..60}; do
            f=$(printf '03-easy-hindi-advanced/chapters/ch%03d.json' "$n")
            git diff --cached --name-only | grep -Fx "$f" >/dev/null
          done
          git diff --cached --name-only | grep -Fx '03-easy-hindi-advanced/authoring-progress.json' >/dev/null
          git diff --cached --name-only | grep -Fx '03-easy-hindi-advanced/global-images.json' >/dev/null
          ts=$(TZ=Asia/Dhaka date '+%a %b %-d, %-I:%M%P %z')
          git commit -m "$ts — 11 files added, 1 file modified; staging removed"
          git push origin HEAD:content/03-easy-hindi-advanced/ch051-ch060
          git fetch origin main
          changed=$(git diff --name-only origin/main...HEAD)
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 12
          bad=$(printf '%s\n' "$changed" | grep -Ev '^03-easy-hindi-advanced/(authoring-progress\.json|global-images\.json|chapters/ch05[1-9]\.json|chapters/ch060\.json)$' || true)
          test -z "$bad"

# delivery trigger
