name: Temporary authoring - Advanced ch001-ch010
on:
  push:
    branches:
      - "tmp/author-adv-ch001-ch010"
    paths:
      - ".github/workflows/tmp-author-adv-ch001-ch010.yml"
permissions:
  contents: write
jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/author-adv-ch001-ch010
      - name: Generate chapter source
        run: |
          sed -i "s/parents\[2\]/parents[1]/" .authoring_tmp/core.py
          sed -i "s/'y': 'য'/'य': 'য'/" .authoring_tmp/core.py
          python3 .authoring_tmp/core.py
      - name: Validate assigned book
        run: python3 scripts/manage.py validate --book 03-easy-hindi-advanced
      - name: Commit clean source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 03-easy-hindi-advanced/chapters/ch001.json 03-easy-hindi-advanced/chapters/ch002.json 03-easy-hindi-advanced/chapters/ch003.json 03-easy-hindi-advanced/chapters/ch004.json 03-easy-hindi-advanced/chapters/ch005.json 03-easy-hindi-advanced/chapters/ch006.json 03-easy-hindi-advanced/chapters/ch007.json 03-easy-hindi-advanced/chapters/ch008.json 03-easy-hindi-advanced/chapters/ch009.json 03-easy-hindi-advanced/chapters/ch010.json 03-easy-hindi-advanced/authoring-progress.json
          git rm .authoring_tmp/core.py .authoring_tmp/data1.py .authoring_tmp/data2.py .authoring_tmp/data3.py .authoring_tmp/data4.py .github/workflows/tmp-author-adv-ch001-ch010.yml
          git commit -m "Author Easy Hindi Advanced ch001-ch010 — 2026-09-12 15:20 +06"
          git push origin HEAD:tmp/author-adv-ch001-ch010
