name: Deliver Hindi vocabulary chapters 81-90

on:
  push:
    branches:
      - chatgpt-transfer-vocab-ch081-ch090-20260912
    paths:
      - '.github/transfer-vocab-ch081-ch090/READY'

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover authored chapter archive prefix
        shell: bash
        run: |
          set -euo pipefail
          cat .github/transfer-vocab-ch081-ch090/part-0[0-6] | base64 -d > /tmp/hindi-vocab-partial.xz
          python3 - <<'PY'
          import lzma
          from pathlib import Path
          data = Path('/tmp/hindi-vocab-partial.xz').read_bytes()
          dec = lzma.LZMADecompressor()
          out = dec.decompress(data)
          Path('/tmp/hindi-vocab-partial.tar').write_bytes(out)
          print(f'recovered_tar_bytes={len(out)} eof={dec.eof}')
          PY

      - name: Restore chapters on latest main and verify exact blobs
        shell: bash
        run: |
          set -euo pipefail
          BOOK='04-easy-hindi-vocabulary-7000-words'
          git fetch origin main content/04-easy-hindi-vocabulary-7000-words/ch081-ch090
          git checkout -B delivery origin/main
          for n in $(seq -w 81 90); do
            test ! -e "$BOOK/chapters/ch0$n.json"
            test ! -e "$BOOK/rosters/ch0$n.json"
          done
          tar -xf /tmp/hindi-vocab-partial.tar --ignore-zeros || true
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          book = Path('04-easy-hindi-vocabulary-7000-words')
          expected = {
            '081':'2820a5e7d27ccfae9f12e91ce27f7300a757477b',
            '082':'406f93ea70556c88b6b459163c02ced997ab8422',
            '083':'5401d8304e2cd0e5699a46af6073f11562644708',
            '084':'d17a36ba02f3eaa9e1f40a0ac73317cf4107e231',
            '085':'81781e5b3b769ff4be6dfd8a4ae0295de1d4ae9a',
            '086':'6d2241dd5cb592c5161ccaa4b17ef5658802c0c2',
            '087':'748bf3ae4b988a3fd4498a7d59dc490cd2ccdf12',
            '088':'0265168a3b4578fe2f304d0446ba37d77ddce475',
            '089':'5001d9b883edd248f11fa340bd54188c51d719db',
            '090':'677eda8c24ad1175e1ecfcd11fc8cef422f18d50',
          }
          for n, want in expected.items():
            p = book / 'chapters' / f'ch{n}.json'
            obj = json.loads(p.read_text(encoding='utf-8'))
            assert obj['chapter_id'] == f'ch{n}'
            got = subprocess.check_output(['git','hash-object',str(p)], text=True).strip()
            print(p, got)
            assert got == want, (p, got, want)
          PY

      - name: Rebuild and verify reviewed rosters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          book = Path('04-easy-hindi-vocabulary-7000-words')
          rationale = 'B1: এই অধ্যায়ের বাস্তব পরিস্থিতিতে উচ্চ-উপযোগী শব্দ বা বাক্যাংশ।'
          source = 'সম্পাদকীয় Standard Hindi ব্যবহার-পর্যালোচনা; এই সেশনে বাহ্যিক অভিধান যাচাই চালানো যায়নি।'
          expected = {
            '081':'c01354e09960b7ef0392ea876508a8943b29d0e4',
            '082':'318757b6d5bab5ad74eb0e3691de1b82892b054c',
            '083':'d0260b27d862df7593db9a47f20d058042728000',
            '084':'ac6ee95235ceaadeed6d82fa713d77050fd27b2c',
            '085':'09765045f86c8a8fd509f150baddf40c2250262f',
            '086':'5a7f8f38f1e8feeb16050e6f58e828a68407386b',
            '087':'8870a4ffcdb53d87ca45e511cd7fd28d6d5729d1',
            '088':'21d644e97d0bbd6d9e87e6356d3d0388a93f6180',
            '089':'407e613970124bfa534daf76af3221ba977cb229',
            '090':'dacd4cc8995b38379f0108c33c03d2bc20a2e7e0',
          }
          (book/'rosters').mkdir(parents=True, exist_ok=True)
          for n, want in expected.items():
            chapter = json.loads((book/'chapters'/f'ch{n}.json').read_text(encoding='utf-8'))
            items=[]
            for v in chapter['vocabulary']:
              items.append({
                'id': v['id'], 'target': v['target'], 'category': v['category'], 'type': v['type'],
                'level_rationale': rationale, 'sources': [source]
              })
            assert len(items) == 30
            roster = {'status':'reviewed','items':items}
            p = book/'rosters'/f'ch{n}.json'
            p.write_text(json.dumps(roster, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
            got = subprocess.check_output(['git','hash-object',str(p)], text=True).strip()
            print(p, got)
            assert got == want, (p, got, want)
          PY

      - name: Run repository validator
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words

      - name: Write truthful batch progress record
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          book = Path('04-easy-hindi-vocabulary-7000-words')
          dest = book/'authoring-progress.json'
          prior = json.loads(dest.read_text(encoding='utf-8')) if dest.exists() else None
          completed=[f'ch{i:03d}' for i in range(81,91)]
          progress={
            'book':'04-easy-hindi-vocabulary-7000-words',
            'base_main_sha':'d79a0fb7cd84c4adfe9f4036038ac9404c05fcb6',
            'branch':'content/04-easy-hindi-vocabulary-7000-words/ch081-ch090',
            'requested_range':{'start':'ch081','end':'ch090','count':10,'requested_ids':completed},
            'completed_ids':completed,
            'unfinished_ids':[],
            'status':'batch_complete',
            'inventory':{
              'chapters':10,'reviewed_rosters':10,'vocabulary_targets':300,'essential_sentences':200,
              'bridge_readings':10,'pure_readings':10,'pure_reading_lines':50,'script_practice_items':50,
              'number_cards':18,'speaking_practice_tasks':60,'reading_image_prompts':20
            },
            'checks_performed':[
              {'check':'authoring_source_review','result':'passed','details':'Read this book INSTRUCTIONS.md as authoritative, ch081-ch090 plans in book.json, chapter-template.json, supplementary.json, and current main.'},
              {'check':'assigned_file_presence_and_identity','result':'passed','details':'Verified ch081-ch090 chapter JSON and matching reviewed roster files at planned paths.'},
              {'check':'roster_and_reserved_ids','result':'passed','details':'30 reviewed roster items per chapter; 25 words plus expressions at positions 6, 12, 18, 24 and 30; contiguous unique IDs v02401-v02700.'},
              {'check':'required_sections_and_counts','result':'passed','details':'Exactly 20 essential sentences, 30 vocabulary entries, 5 script cards, 4-8 pure-reading lines, 6 speaking tasks and 2 image prompts per chapter; 18 number cards total.'},
              {'check':'pronunciation_and_word_reconstruction','result':'passed','details':'Local audit verified annotated target strings reconstruct exactly from ordered word_pronunciations.'},
              {'check':'vocabulary_sources','result':'passed','details':'Local audit verified every vocabulary source_sentence_id exists and source_form occurs in its cited sentence.'},
              {'check':'mixed_and_pure_readings','result':'passed','details':'Local audit verified bridge text_md mirrors segments and pure readings have annotated lines plus full Bangla pronunciation and meaning.'},
              {'check':'bangla_prose_audit','result':'passed','details':'Local audit found no unannotated Devanagari examples in learner-facing Bangla prose fields.'},
              {'check':'image_prompt_keys_and_scene_match','result':'passed','details':'Two required reading-specific prompts per chapter; all subjects contain the required no-readable-text prohibition.'},
              {'check':'manual_language_review','result':'passed','details':'Reviewed B1 usefulness, Standard Hindi naturalness, Bengali meanings, pronunciation cues, source fit and reading coherence. Chapter status remains drafted, not independently reviewed.'},
              {'check':'python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words','result':'passed','details':'Ran on a GitHub Actions checkout of repository main after restoring the exact authored chapter blobs and reviewed rosters; validator passed.'}
            ],
            'remaining_issues':['No known structural issue remains in ch081-ch090.','Chapter status is drafted, not independently reviewed.','Full-book validation, assembly, generated images, PDF/EPUB output and chapters outside ch081-ch090 were not attempted.'],
            'resume_point':'Requested ch081-ch090 batch is complete. Do not continue into ch091 or later chapters without a separate assignment.',
            'updated_at_local':'2026-09-12T15:23+06:00',
            'git_delivery':{'target_branch':'content/04-easy-hindi-vocabulary-7000-words/ch081-ch090','base_branch':'main','base_main_sha':'d79a0fb7cd84c4adfe9f4036038ac9404c05fcb6','force_push':False}
          }
          if prior is not None:
            progress['preserved_prior_progress_checkpoint']=prior
          dest.write_text(json.dumps(progress, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY

      - name: Commit and push content branch
        shell: bash
        run: |
          set -euo pipefail
          BOOK='04-easy-hindi-vocabulary-7000-words'
          TARGET='content/04-easy-hindi-vocabulary-7000-words/ch081-ch090'
          git config user.name 'polodev'
          git config user.email 'polodev10@gmail.com'
          for n in $(seq -w 81 90); do
            git add "$BOOK/chapters/ch0$n.json" "$BOOK/rosters/ch0$n.json"
          done
          git add "$BOOK/authoring-progress.json"
          test "$(git diff --cached --name-only | wc -l)" -eq 21
          test -z "$(git diff --cached --diff-filter=DR --name-only)"
          git diff --cached --name-status
          git commit -m 'Complete Hindi vocabulary chapters 81-90'
          commit_sha=$(git rev-parse HEAD)
          git push origin HEAD:"$TARGET"
          git fetch origin "$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$commit_sha"
          echo "DELIVERY_COMMIT=$commit_sha"
