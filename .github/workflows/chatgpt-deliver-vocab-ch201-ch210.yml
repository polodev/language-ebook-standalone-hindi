name: Diagnose patched vocabulary chapters 201-210

on:
  push:
    branches:
      - chatgpt-transfer-vocab-ch201-ch210-20260913
    paths:
      - '.github/transfer/ch201-210/READY'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct, patch, and print remaining duplicates
        shell: bash
        env:
          EXPECTED_MAIN: 9dbdc14b189c0d9094d3502ac616da544d24dfb1
          BOOK: 04-easy-hindi-vocabulary-7000-words
        run: |
          set -euo pipefail
          cat .github/transfer/ch201-210/ch201-210.part-* | base64 -d > /tmp/ch201-210.tar.xz
          echo 'f104a7f1c85ba4d9c195cdb5e387c4aabf58908a155f379b3b3af231afa1f42f  /tmp/ch201-210.tar.xz' | sha256sum -c -
          xz -dc /tmp/ch201-210.tar.xz > /tmp/ch201-210.tar
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git checkout -B diagnostic origin/main
          tar -xf /tmp/ch201-210.tar -C "$BOOK"
          python3 - <<'PY'
          import json, unicodedata
          from collections import defaultdict
          from pathlib import Path

          root = Path('04-easy-hindi-vocabulary-7000-words')
          fixes = [
              ('ch201','समयसीमा','मियाद','সমযসীমা','মিয়াদ','smysiimaa','miyaad'),
              ('ch201','उत्तरदायित्व','जवाबदेही','উত্তরদাযিত্঵','জবাবদেহী','uttrdaayitv','javaabdehii'),
              ('ch203','सत्यापन','पुष्टिकरण','সত্যাপন','পুষ্টিকরণ','styaapn','pushtikaran'),
              ('ch203','निष्पक्षता','निरपेक्षता','নিষ্পক্ষতা','নিরপেক্ষতা','nisspksstaa','nirapekshataa'),
              ('ch205','पूर्वानुमान','प्राक्कलन','পূর্঵ানুমান','প্রাক্কলন','puurvaanumaan','praakkalan'),
              ('ch207','पुनर्चक्रण','पुनरुपयोग','পুনর্চক্রণ','পুনরুপযোগ','punrckrnn','punarupayog'),
          ]

          def repl(value, pairs):
              if isinstance(value, dict): return {k: repl(v,pairs) for k,v in value.items()}
              if isinstance(value, list): return [repl(v,pairs) for v in value]
              if isinstance(value, str):
                  for a,b in pairs: value=value.replace(a,b)
              return value

          by={}
          for ch,oh,nh,ob,nb,orom,nrom in fixes:
              by.setdefault(ch,[]).append((oh,nh,ob,nb,orom,nrom))
          for ch, fs in by.items():
              cp=root/'chapters'/f'{ch}.json'; rp=root/'rosters'/f'{ch}.json'
              c=json.loads(cp.read_text(encoding='utf-8')); r=json.loads(rp.read_text(encoding='utf-8'))
              pairs=[]
              for oh,nh,ob,nb,orom,nrom in fs: pairs += [(oh,nh),(ob,nb),(orom,nrom)]
              c=repl(c,pairs); r=repl(r,[(oh,nh) for oh,nh,*_ in fs])
              cp.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              rp.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          def normalized(text):
              return ' '.join(unicodedata.normalize('NFC', text).casefold().split()).strip('.,!?।。！？')
          seen=defaultdict(list)
          for path in sorted((root/'rosters').glob('ch*.json')):
              data=json.loads(path.read_text(encoding='utf-8'))
              for item in data.get('items',[]):
                  t=item.get('target')
                  if t: seen[normalized(t)].append((t,path.name,item.get('id')))
          found=0
          for key,uses in sorted(seen.items()):
              if len(uses)>1 and any(201 <= int(name[2:5]) <= 210 for _,name,_ in uses):
                  found+=1; print('POST_PATCH_DUPLICATE',repr(key),uses)
          print('POST_PATCH_DUPLICATE_COUNT',found)
          PY
