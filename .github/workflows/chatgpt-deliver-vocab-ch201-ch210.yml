name: Diagnose baseline validator state for vocabulary delivery

on:
  push:
    branches:
      - chatgpt-transfer-vocab-ch201-ch210-20260913
    paths:
      - '.github/transfer/ch201-210/READY'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check exact main before requested payload
        shell: bash
        env:
          EXPECTED_MAIN: 9dbdc14b189c0d9094d3502ac616da544d24dfb1
          BOOK: 04-easy-hindi-vocabulary-7000-words
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git checkout -B baseline origin/main
          set +e
          python3 scripts/manage.py validate --book "$BOOK" >/tmp/main-validator.out 2>&1
          rc=$?
          set -e
          echo "MAIN_VALIDATOR_RC=$rc"
          cat /tmp/main-validator.out
          python3 - <<'PY'
          import json, unicodedata
          from collections import defaultdict
          from pathlib import Path
          root=Path('04-easy-hindi-vocabulary-7000-words/rosters')
          def norm(t): return ' '.join(unicodedata.normalize('NFC',t).casefold().split()).strip('.,!?।。！？')
          seen=defaultdict(list)
          for p in sorted(root.glob('ch*.json')):
              d=json.loads(p.read_text(encoding='utf-8'))
              for x in d.get('items',[]):
                  if x.get('target'): seen[norm(x['target'])].append((x['target'],p.name,x.get('id')))
          ds=[(k,v) for k,v in seen.items() if len(v)>1]
          print('MAIN_DUPLICATE_COUNT',len(ds))
          for k,v in ds: print('MAIN_DUPLICATE',repr(k),v)
          PY
