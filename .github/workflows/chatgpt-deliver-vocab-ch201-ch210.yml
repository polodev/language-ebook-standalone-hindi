name: Diagnose vocabulary chapters 201-210

on:
  push:
    branches:
      - chatgpt-transfer-vocab-ch201-ch210-20260913
    paths:
      - '.github/transfer/ch201-210/READY'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/transfer/ch201-210/ch201-210.part-* | base64 -d > /tmp/ch201-210.tar.xz
          echo 'f104a7f1c85ba4d9c195cdb5e387c4aabf58908a155f379b3b3af231afa1f42f  /tmp/ch201-210.tar.xz' | sha256sum -c -
          xz -dc /tmp/ch201-210.tar.xz > /tmp/ch201-210.tar

      - name: Print normalized duplicate targets
        shell: bash
        env:
          EXPECTED_MAIN: 9dbdc14b189c0d9094d3502ac616da544d24dfb1
          BOOK: 04-easy-hindi-vocabulary-7000-words
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git checkout -B diagnostic origin/main
          tar -xf /tmp/ch201-210.tar -C "$BOOK"
          python3 - <<'PY'
          import json, unicodedata
          from collections import defaultdict
          from pathlib import Path

          def normalized(text):
              return ' '.join(unicodedata.normalize('NFC', text).casefold().split()).strip('.,!?।。！？')

          root = Path('04-easy-hindi-vocabulary-7000-words/rosters')
          seen = defaultdict(list)
          for path in sorted(root.glob('ch*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              for item in data.get('items', []):
                  target = item.get('target')
                  if target:
                      seen[normalized(target)].append((target, path.name, item.get('id')))

          found = 0
          for key, uses in sorted(seen.items()):
              if len(uses) > 1 and any(201 <= int(name[2:5]) <= 210 for _, name, _ in uses):
                  found += 1
                  print('DUPLICATE_TARGET', repr(key), uses)
          print('DUPLICATE_COUNT', found)
          PY
