name: Inspect vocabulary chapters 201-210 conflicts

on:
  push:
    branches:
      - chatgpt-transfer-vocab-ch201-ch210-20260913
    paths:
      - '.github/transfer/ch201-210/READY'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and inspect six entries
        shell: bash
        env:
          EXPECTED_MAIN: 9dbdc14b189c0d9094d3502ac616da544d24dfb1
          BOOK: 04-easy-hindi-vocabulary-7000-words
        run: |
          set -euo pipefail
          cat .github/transfer/ch201-210/ch201-210.part-* | base64 -d > /tmp/ch201-210.tar.xz
          echo 'f104a7f1c85ba4d9c195cdb5e387c4aabf58908a155f379b3b3af231afa1f42f  /tmp/ch201-210.tar.xz' | sha256sum -c -
          xz -dc /tmp/ch201-210.tar.xz > /tmp/ch201-210.tar
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git checkout -B inspect origin/main
          tar -xf /tmp/ch201-210.tar -C "$BOOK"
          python3 - <<'PY'
          import json
          from pathlib import Path
          ids = {
              'v06011':'ch201', 'v06021':'ch201', 'v06082':'ch203',
              'v06085':'ch203', 'v06137':'ch205', 'v06195':'ch207'
          }
          root = Path('04-easy-hindi-vocabulary-7000-words')
          for vid, ch in ids.items():
              chapter = json.loads((root/'chapters'/f'{ch}.json').read_text(encoding='utf-8'))
              roster = json.loads((root/'rosters'/f'{ch}.json').read_text(encoding='utf-8'))
              v = next(x for x in chapter['vocabulary'] if x['id']==vid)
              r = next(x for x in roster['items'] if x['id']==vid)
              s = next(x for x in chapter['sentences'] if x['id']==v['source_sentence_id'])
              print('ENTRY_BEGIN', vid, ch)
              print('ROSTER', json.dumps(r, ensure_ascii=False, separators=(',',':')))
              print('VOCAB', json.dumps(v, ensure_ascii=False, separators=(',',':')))
              print('SOURCE', json.dumps(s, ensure_ascii=False, separators=(',',':')))
              print('ENTRY_END', vid)
          PY
