name: Deliver Hindi chapters 31-40

on:
  push:
    branches:
      - chatgpt-transfer-ch031-ch040-20260911
    paths:
      - '.github/transfer/TRIGGER-*'

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/transfer/ch31-40.part-* | base64 -d > /tmp/ch31-40.tar.xz
          echo '2a9db3421add1e8afbd9e29f17667f065a2630c350d2b154b951725e747478cf  /tmp/ch31-40.tar.xz' | sha256sum -c -
          mkdir -p /tmp/ch31-40-payload
          xz -dc /tmp/ch31-40.tar.xz | tar -xf - -C /tmp/ch31-40-payload
          for n in {31..40}; do
            f=$(printf '/tmp/ch31-40-payload/01-easy-hindi-foundation/chapters/ch%03d.json' "$n")
            test -s "$f"
          done
          test -s /tmp/ch31-40-payload/.github/transfer/ch31-40-progress.json

      - name: Apply to exact current main and validate
        shell: bash
        env:
          EXPECTED_MAIN: 85c944e296cf7741677b7179e728bba7d859ced6
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git checkout -B delivery origin/main

          if test -f 01-easy-hindi-foundation/authoring-progress.json; then
            cp 01-easy-hindi-foundation/authoring-progress.json /tmp/prior-authoring-progress.json
          fi

          mkdir -p 01-easy-hindi-foundation/chapters
          for n in {31..40}; do
            f=$(printf 'ch%03d.json' "$n")
            cp "/tmp/ch31-40-payload/01-easy-hindi-foundation/chapters/$f" "01-easy-hindi-foundation/chapters/$f"
          done

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          base = os.environ['EXPECTED_MAIN']
          progress = json.loads(Path('/tmp/ch31-40-payload/.github/transfer/ch31-40-progress.json').read_text(encoding='utf-8'))
          prior = Path('/tmp/prior-authoring-progress.json')
          if prior.exists():
              progress['preserved_prior_progress_checkpoint'] = json.loads(prior.read_text(encoding='utf-8'))
          progress['branch'] = 'main'
          progress['base_commit'] = base
          progress['git_delivery'] = {
              'status': 'delivery_commit_pending_at_validation',
              'target_branch': 'main',
              'base_main_sha': base,
              'method': 'GitHub Actions byte-exact transport from a temporary branch, followed by a normal fast-forward push.',
              'force_push': False
          }
          Path('01-easy-hindi-foundation/authoring-progress.json').write_text(
              json.dumps(progress, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

          python3 scripts/manage.py validate --book 01-easy-hindi-foundation

          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('01-easy-hindi-foundation/authoring-progress.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['repository_validator'] = {
              'command': 'python3 scripts/manage.py validate --book 01-easy-hindi-foundation',
              'run': True,
              'result': 'passed on repository checkout before commit'
          }
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit and fast-forward push main
        shell: bash
        env:
          EXPECTED_MAIN: 85c944e296cf7741677b7179e728bba7d859ced6
        run: |
          set -euo pipefail
          git config user.name 'polodev'
          git config user.email 'polodev10@gmail.com'
          git add \
            01-easy-hindi-foundation/chapters/ch031.json \
            01-easy-hindi-foundation/chapters/ch032.json \
            01-easy-hindi-foundation/chapters/ch033.json \
            01-easy-hindi-foundation/chapters/ch034.json \
            01-easy-hindi-foundation/chapters/ch035.json \
            01-easy-hindi-foundation/chapters/ch036.json \
            01-easy-hindi-foundation/chapters/ch037.json \
            01-easy-hindi-foundation/chapters/ch038.json \
            01-easy-hindi-foundation/chapters/ch039.json \
            01-easy-hindi-foundation/chapters/ch040.json \
            01-easy-hindi-foundation/authoring-progress.json

          git diff --cached --name-status
          added=$(git diff --cached --diff-filter=A --name-only | wc -l | tr -d ' ')
          modified=$(git diff --cached --diff-filter=M --name-only | wc -l | tr -d ' ')
          deleted=$(git diff --cached --diff-filter=D --name-only | wc -l | tr -d ' ')
          total=$(git diff --cached --name-only | wc -l | tr -d ' ')
          test "$added" -eq 10
          test "$modified" -eq 1
          test "$deleted" -eq 0
          test "$total" -eq 11

          plural() { test "$1" -eq 1 && printf 'file' || printf 'files'; }
          stamp=$(TZ=Asia/Dhaka date '+%a %b %-d, %-I:%M%P')
          message="$stamp — $modified $(plural "$modified") modified, $added $(plural "$added") added, $deleted $(plural "$deleted") deleted"
          git commit -m "$message"
          delivered_sha=$(git rev-parse HEAD)

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git push origin HEAD:main
          echo "DELIVERED_SHA=$delivered_sha" >> "$GITHUB_ENV"

      - name: Verify remote main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$DELIVERED_SHA"
          for n in {31..40}; do
            f=$(printf '01-easy-hindi-foundation/chapters/ch%03d.json' "$n")
            git cat-file -e "$DELIVERED_SHA:$f"
          done
          git cat-file -e "$DELIVERED_SHA:01-easy-hindi-foundation/authoring-progress.json"
          echo "Verified remote main at $DELIVERED_SHA"
