name: Temporary ch181-ch190 generation and validation v3

on:
  push:
    branches:
      - content/04-easy-hindi-vocabulary-7000-words/ch181-ch190

permissions:
  contents: write

jobs:
  generate-validate-commit:
    if: ${{ !contains(github.event.head_commit.message, 'Complete Hindi vocabulary chapters 181-190') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct corrected generator
        run: |
          cat .tmp-ch181-190-v3/payload_*.txt | base64 -d | gzip -d > /tmp/gen_ch181_190.py
          sed -i "s#OUT = Path('/mnt/data/hindi_ch181_190')#OUT = Path('.')#" /tmp/gen_ch181_190.py
          python3 -m pip install --quiet Unidecode
      - name: Generate requested batch
        run: python3 /tmp/gen_ch181_190.py
      - name: Check new roster targets against starting main
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          book = Path('04-easy-hindi-vocabulary-7000-words')
          base_sha = '9dbdc14b189c0d9094d3502ac616da544d24dfb1'
          roster_root = f'{book}/rosters/'
          paths = subprocess.check_output(
              ['git', 'ls-tree', '-r', '--name-only', base_sha, '--', f'{book}/rosters'],
              text=True,
          ).splitlines()

          old_targets = set()
          roster_re = re.compile(r'/ch(\d{3})\.json$')
          for path in paths:
              match = roster_re.search(path)
              if not match or int(match.group(1)) >= 181:
                  continue
              raw = subprocess.check_output(['git', 'show', f'{base_sha}:{path}'], text=True)
              data = json.loads(raw)
              old_targets.update(item['target'] for item in data.get('items', []))

          new_targets = []
          collisions = []
          seen_new = set()
          for ch in range(181, 191):
              data = json.loads((book / 'rosters' / f'ch{ch:03d}.json').read_text(encoding='utf-8'))
              for item in data.get('items', []):
                  target = item['target']
                  if target in old_targets:
                      collisions.append((ch, item['id'], target, 'earlier chapter'))
                  if target in seen_new:
                      collisions.append((ch, item['id'], target, 'within ch181-ch190'))
                  seen_new.add(target)
                  new_targets.append(target)

          print('STARTING_MAIN_ROSTER_COUNT', sum(1 for p in paths if roster_re.search(p) and int(roster_re.search(p).group(1)) < 181))
          print('NEW_TARGET_COUNT', len(new_targets))
          print('NEW_UNIQUE_TARGET_COUNT', len(set(new_targets)))
          print('NEW_COLLISION_COUNT', len(collisions))
          for row in collisions:
              print('NEW_COLLISION', row)
          if len(new_targets) != 300 or len(set(new_targets)) != 300 or collisions:
              raise SystemExit(1)
          PY
      - name: Compare validator result with starting-main baseline
        run: |
          rm -rf /tmp/main-check
          git worktree add --detach /tmp/main-check 9dbdc14b189c0d9094d3502ac616da544d24dfb1
          set +e
          (cd /tmp/main-check && python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words) > /tmp/base-validator.txt 2>&1
          base_rc=$?
          python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words > /tmp/branch-validator.txt 2>&1
          branch_rc=$?
          set -e
          echo '--- starting main validator ---'
          cat /tmp/base-validator.txt
          echo '--- branch validator ---'
          cat /tmp/branch-validator.txt
          grep '^- ' /tmp/base-validator.txt | sort > /tmp/base-errors.txt || true
          grep '^- ' /tmp/branch-validator.txt | sort > /tmp/branch-errors.txt || true
          if [ "$base_rc" -ne "$branch_rc" ] || ! cmp -s /tmp/base-errors.txt /tmp/branch-errors.txt; then
            echo 'Branch validator differs from the starting-main baseline.'
            diff -u /tmp/base-errors.txt /tmp/branch-errors.txt || true
            exit 1
          fi
          echo 'Validator parity confirmed: this batch introduces no additional validator errors beyond the starting-main baseline.'
      - name: Run repository tests
        run: python3 -m unittest discover -s tests
      - name: Commit generated source files
        run: |
          rm -rf .tmp-ch181-190 .tmp-ch181-190-v2 .tmp-ch181-190-v3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 04-easy-hindi-vocabulary-7000-words .tmp-ch181-190 .tmp-ch181-190-v2 .tmp-ch181-190-v3
          git commit -m "Complete Hindi vocabulary chapters 181-190"
          git push origin HEAD
