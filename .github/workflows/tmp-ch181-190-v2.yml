name: Temporary ch181-ch190 generation and validation v2

on:
  push:
    branches:
      - content/04-easy-hindi-vocabulary-7000-words/ch181-ch190

permissions:
  contents: write

jobs:
  generate-validate-commit:
    if: ${{ !contains(github.event.head_commit.message, 'Complete Hindi vocabulary chapters 181-190') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct generator
        run: |
          cat .tmp-ch181-190-v2/payload_*.txt | base64 -d | gzip -d > /tmp/gen_ch181_190.py
          sed -i "s#OUT = Path('/mnt/data/hindi_ch181_190')#OUT = Path('.')#" /tmp/gen_ch181_190.py
          python3 -m pip install --quiet Unidecode
      - name: Generate requested batch
        run: python3 /tmp/gen_ch181_190.py
      - name: Diagnose roster collisions
        run: |
          python3 - <<'PY'
          import json, glob
          seen = {}
          dupes = []
          for path in sorted(glob.glob('04-easy-hindi-vocabulary-7000-words/rosters/ch*.json')):
              data = json.load(open(path, encoding='utf-8'))
              for item in data.get('items', []):
                  target = item.get('target')
                  ident = f"{path}:{item.get('id')}"
                  if target in seen:
                      dupes.append((target, seen[target], ident))
                  else:
                      seen[target] = ident
          print('DUPLICATE_COUNT', len(dupes))
          for d in dupes:
              print('DUPLICATE_TARGET', repr(d[0]), d[1], d[2])
          PY
      - name: Validate requested book
        run: python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words
      - name: Run repository tests
        run: python3 -m unittest discover -s tests
      - name: Commit generated source files
        run: |
          rm -rf .tmp-ch181-190 .tmp-ch181-190-v2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 04-easy-hindi-vocabulary-7000-words .tmp-ch181-190 .tmp-ch181-190-v2
          git commit -m "Complete Hindi vocabulary chapters 181-190"
          git push origin HEAD
