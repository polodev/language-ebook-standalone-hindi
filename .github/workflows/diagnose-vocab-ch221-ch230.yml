name: diagnose-vocab-ch221-ch230
on:
  push:
    branches:
      - content/04-easy-hindi-vocabulary-7000-words/ch221-ch230
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/04-easy-hindi-vocabulary-7000-words/ch221-ch230
          fetch-depth: 0
      - name: Generate and list all collisions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-vocab-ch221-ch230.yml').read_text()
          start="          cat > /tmp/generate.py <<'PY'\n"
          end="          PY\n          python3 /tmp/generate.py"
          body=p.split(start,1)[1].split(end,1)[0]
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())+'\n'
          body=body.replace("def fp(s): return ' '.join(bn(m.group(1)) for m in re.finditer(r'\\S+',s))","def fp(s): return ' '.join(bn(m.group(0)) for m in re.finditer(r'\\S+',s))")
          Path('/tmp/generate.py').write_text(body)
          PY
          python3 /tmp/generate.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          seen={}
          hits=[]
          root=Path('04-easy-hindi-vocabulary-7000-words/rosters')
          for p in sorted(root.glob('ch*.json')):
              try: n=int(p.stem[2:])
              except: continue
              d=json.loads(p.read_text())
              for it in d.get('items',[]):
                  t=it.get('target')
                  if t in seen:
                      a=seen[t]
                      if n>=221 or a[0]>=221: hits.append((t,a[0],a[1],n,it.get('id')))
                  else: seen[t]=(n,it.get('id'))
          print('COLLISIONS',len(hits))
          for x in hits: print('COLLISION\t'+'\t'.join(map(str,x)))
          if hits: raise SystemExit(1)
          PY