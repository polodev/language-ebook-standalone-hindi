name: Deliver vocabulary chapters 161-170

on:
  push:
    branches:
      - transfer/04-vocab-ch161-ch170-20260913
    paths:
      - '.github/transfer-04-vocab-161-170/READY'

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct archive and inspect v04817
        shell: bash
        run: |
          set -euo pipefail
          cat .github/transfer-04-vocab-161-170/part-* | base64 -d > /tmp/ch161-170.tar.xz
          echo '885d26d20487b427b86e6fc6797c46a41b031132792f1166258292612330d85a  /tmp/ch161-170.tar.xz' | sha256sum -c -
          xz -dc /tmp/ch161-170.tar.xz > /tmp/ch161-170.tar
          tar -xf /tmp/ch161-170.tar
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('04-easy-hindi-vocabulary-7000-words/chapters/ch161.json').read_text(encoding='utf-8'))
          r = json.loads(Path('04-easy-hindi-vocabulary-7000-words/rosters/ch161.json').read_text(encoding='utf-8'))
          item = next(x for x in c['vocabulary'] if x['id'] == 'v04817')
          roster = next(x for x in r['items'] if x['id'] == 'v04817')
          sent = next(x for x in c['sentences'] if x['id'] == item['source_sentence_id'])
          print('ROSTER', json.dumps(roster, ensure_ascii=False))
          print('VOCAB', json.dumps(item, ensure_ascii=False))
          print('SOURCE_SENTENCE', json.dumps(sent, ensure_ascii=False))
          old = item['target']
          def walk(v, path='root'):
              if isinstance(v, dict):
                  for k, x in v.items(): walk(x, path + '.' + k)
              elif isinstance(v, list):
                  for i, x in enumerate(v): walk(x, f'{path}[{i}]')
              elif isinstance(v, str) and old in v:
                  print('OCCURRENCE', path, json.dumps(v, ensure_ascii=False))
          walk(c)
          PY
