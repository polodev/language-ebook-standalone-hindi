name: Author Hindi vocabulary ch191-ch200

on:
  push:
    branches:
      - 'content/04-easy-hindi-vocabulary-7000-words/ch191-ch200'

permissions:
  contents: write

jobs:
  author-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct checked authoring payload
        shell: bash
        run: |
          set -euo pipefail
          cat .content/generator.part01.b64 .content/generator.part02.b64 | base64 -d | xz -d > .content/generate.py
          python3 .content/generate.py

      - name: Install chapters, rosters, and progress record
        shell: bash
        run: |
          set -euo pipefail
          BOOK='04-easy-hindi-vocabulary-7000-words'
          mkdir -p "$BOOK/chapters" "$BOOK/rosters" "$BOOK/progress-archive"
          if [ -f "$BOOK/authoring-progress.json" ]; then
            cp "$BOOK/authoring-progress.json" "$BOOK/progress-archive/authoring-progress-before-ch191-ch200.json"
          fi
          for n in $(seq 191 200); do
            cp ".content/generated/ch${n}.json" "$BOOK/chapters/ch${n}.json"
            cp ".content/generated/roster_ch${n}.json" "$BOOK/rosters/ch${n}.json"
          done
          cp .content/generated/authoring-progress.json "$BOOK/authoring-progress.json"

      - name: Diagnose vocabulary-roster collisions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import unicodedata
          from pathlib import Path

          root = Path('04-easy-hindi-vocabulary-7000-words/rosters')
          def normalized(text):
              return ' '.join(unicodedata.normalize('NFC', text).casefold().split()).strip('.,!?।。！？')

          seen = {}
          collisions = []
          for path in sorted(root.glob('ch*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              for item in data.get('items', []):
                  key = normalized(item['target'])
                  current = f"{path.name}:{item['id']}:{item['target']}"
                  if key in seen:
                      collisions.append((seen[key], current))
                  else:
                      seen[key] = current
          if collisions:
              print('CROSS_ROSTER_DUPLICATES_BEGIN')
              for first, second in collisions:
                  print(f'DUPLICATE | {first} | {second}')
              print('CROSS_ROSTER_DUPLICATES_END')
          else:
              print('CROSS_ROSTER_DUPLICATES_NONE')
          PY

      - name: Run repository validator
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words

      - name: Record successful repository validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('04-easy-hindi-vocabulary-7000-words/authoring-progress.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          for check in data.get('checks_performed', []):
              if check.get('check') == 'repository_validator':
                  check['result'] = 'passed'
                  check['details'] = 'Ran python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words on the repository checkout after installing ch191-ch200; validator passed against current repository state.'
          data['remaining_issues'] = [
              item for item in data.get('remaining_issues', [])
              if 'Cross-roster duplicate checking' not in item
          ]
          data['repository_validation'] = {
              'command': 'python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words',
              'result': 'passed'
          }
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Remove temporary transport and commit reviewed batch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .content
          rm -f .github/workflows/ch191-ch200-authoring.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          LOCAL_STAMP="$(TZ=Asia/Dhaka date '+%Y-%m-%d %H:%M %z')"
          git commit -m "Complete Hindi vocabulary ch191-ch200 (${LOCAL_STAMP}; 22 source/progress files, 10 chapters, 300 targets)"
          git push origin HEAD
