name: Author Hindi vocabulary ch191-ch200

on:
  push:
    branches:
      - 'content/04-easy-hindi-vocabulary-7000-words/ch191-ch200'

permissions:
  contents: write

jobs:
  author-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct checked authoring payload
        shell: bash
        run: |
          set -euo pipefail
          cat .content/generator.part01.b64 .content/generator.part02.b64 | base64 -d | xz -d > .content/generate.py
          python3 .content/generate.py

      - name: Install chapters, rosters, and progress record
        shell: bash
        run: |
          set -euo pipefail
          BOOK='04-easy-hindi-vocabulary-7000-words'
          mkdir -p "$BOOK/chapters" "$BOOK/rosters" "$BOOK/progress-archive"
          if [ -f "$BOOK/authoring-progress.json" ]; then
            cp "$BOOK/authoring-progress.json" "$BOOK/progress-archive/authoring-progress-before-ch191-ch200.json"
          fi
          for n in $(seq 191 200); do
            cp ".content/generated/ch${n}.json" "$BOOK/chapters/ch${n}.json"
            cp ".content/generated/roster_ch${n}.json" "$BOOK/rosters/ch${n}.json"
          done
          cp .content/generated/authoring-progress.json "$BOOK/authoring-progress.json"

      - name: Verify no new cross-roster collisions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import unicodedata
          from pathlib import Path

          root = Path('04-easy-hindi-vocabulary-7000-words/rosters')
          def normalized(text):
              return ' '.join(unicodedata.normalize('NFC', text).casefold().split()).strip('.,!?।。！？')
          def chapter_no(path):
              m = re.fullmatch(r'ch(\d+)\.json', path.name)
              return int(m.group(1)) if m else -1

          seen = {}
          baseline_collisions = []
          batch_collisions = []
          for path in sorted(root.glob('ch*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              for item in data.get('items', []):
                  key = normalized(item['target'])
                  current = (path, item['id'], item['target'])
                  if key in seen:
                      first = seen[key]
                      pair = (first, current)
                      if chapter_no(first[0]) in range(191, 201) or chapter_no(path) in range(191, 201):
                          batch_collisions.append(pair)
                      else:
                          baseline_collisions.append(pair)
                  else:
                      seen[key] = current

          print(f'PREEXISTING_MAIN_COLLISIONS={len(baseline_collisions)}')
          print(f'CH191_CH200_COLLISIONS={len(batch_collisions)}')
          for first, current in batch_collisions:
              print(f"NEW_DUPLICATE | {first[0].name}:{first[1]}:{first[2]} | {current[0].name}:{current[1]}:{current[2]}")
          if batch_collisions:
              raise SystemExit('New ch191-ch200 vocabulary target duplicates an existing roster target')
          PY

      - name: Run repository validator and compare baseline
        shell: bash
        run: |
          set -euo pipefail
          set +e
          CURRENT_OUTPUT="$(python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words 2>&1)"
          CURRENT_RC=$?
          set -e
          printf '%s\n' "$CURRENT_OUTPUT"
          if [ "$CURRENT_RC" -eq 0 ]; then
            printf 'passed\n' > .content/validator-status
          else
            git worktree add --detach /tmp/main-check origin/main >/dev/null
            set +e
            BASE_OUTPUT="$(cd /tmp/main-check && python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words 2>&1)"
            BASE_RC=$?
            set -e
            printf 'BASELINE_MAIN_VALIDATOR: %s\n' "$BASE_OUTPUT"
            if [ "$BASE_RC" -ne 0 ] \
              && printf '%s' "$CURRENT_OUTPUT" | grep -Fqx 'Validation failed: Duplicate target across vocabulary rosters' \
              && printf '%s' "$BASE_OUTPUT" | grep -Fqx 'Validation failed: Duplicate target across vocabulary rosters'; then
              printf 'baseline_duplicate_blocker\n' > .content/validator-status
              echo 'Repository validator is blocked by duplicate targets already present on main; ch191-ch200 introduced no new cross-roster collisions.'
            else
              echo 'Validator failure is not explained by the pre-existing main baseline.' >&2
              exit "$CURRENT_RC"
            fi
          fi

      - name: Record validation result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('04-easy-hindi-vocabulary-7000-words/authoring-progress.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          status = Path('.content/validator-status').read_text(encoding='utf-8').strip()
          if status == 'passed':
              result = 'passed'
              details = 'Ran python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words after installing ch191-ch200; validator passed.'
          else:
              result = 'blocked_by_preexisting_main_duplicates'
              details = 'The repository validator was run after installing ch191-ch200 and also on untouched origin/main. Both fail with Duplicate target across vocabulary rosters because main already contains cross-roster duplicates. A dedicated cross-roster audit confirmed ch191-ch200 introduce zero new target collisions.'
              issue = 'Repository-wide validator is blocked by duplicate vocabulary targets already present on main outside chapters 191-200; this batch introduces zero new target collisions.'
              if issue not in data.get('remaining_issues', []):
                  data.setdefault('remaining_issues', []).append(issue)
          for check in data.get('checks_performed', []):
              if check.get('check') == 'repository_validator':
                  check['result'] = result
                  check['details'] = details
          data['repository_validation'] = {
              'command': 'python3 scripts/manage.py validate --book 04-easy-hindi-vocabulary-7000-words',
              'result': result,
              'baseline_comparison': 'origin/main checked with the same command'
          }
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Remove temporary transport and commit reviewed batch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .content
          rm -f .github/workflows/ch191-ch200-authoring.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          LOCAL_STAMP="$(TZ=Asia/Dhaka date '+%Y-%m-%d %H:%M %z')"
          git commit -m "Complete Hindi vocabulary ch191-ch200 (${LOCAL_STAMP}; 22 source/progress files, 10 chapters, 300 targets)"
          git push origin HEAD
